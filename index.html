    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

        body { font-family: 'Cairo', sans-serif; background-color: #0b0f19; color: #f3f4f6; }
        .suggestions-list { background-color: #1f2937; border: 1px solid #374151; max-height: 180px; overflow-y: auto; position: absolute; width: 100%; z-index: 100; border-radius: 0.5rem; margin-top: 2px; }
        .suggestion-item { padding: 10px 12px; font-size: 11px; color: #d1d5db; cursor: pointer; border-bottom: 1px solid #374151; }
        .suggestion-item:hover { background-color: #374151; color: #fff; }
    </style>
</head>
<body class="min-h-screen flex flex-col pb-10">

                    <p class="text-xs text-amber-300 font-bold mt-0.5">أم بكر: 336-944-8034</p>
                </div>

            <div class="flex items-center space-x-3 space-x-reverse">
                <button onclick="openCart()" class="bg-amber-500 text-gray-950 font-bold px-4 py-1.5 rounded-lg text-sm flex items-center gap-2">
                    <span>السلة</span>
                    <span id="cart-badge" class="bg-red-600 text-white text-xs w-5 h-5 rounded-full flex items-center justify-center hidden">0</span>
                </button>
            </div>
        </div>
    </header>

    <section class="relative py-20 px-4 border-b border-gray-800 text-center bg-cover bg-center bg-no-repeat" style="background-image: url('hero-bg.jpg')">

        <div class="relative z-10 max-w-4xl mx-auto">
            <h2 class="text-5xl md:text-7xl font-black text-amber-400 mb-2 tracking-wider">أكلاتنا</h2>
            <p class="text-xl md:text-2xl font-extrabold text-white mb-6">أطباق عراقية طازجة</p>
            <input 
                type="text" 
                id="search-input"
                placeholder="ابحث عن طبقك المفضّل..."

                class="w-full max-w-lg bg-gray-900/90 border border-amber-500/60 rounded-xl py-3 px-5 text-white text-sm focus:outline-none focus:border-amber-400 shadow-2xl"
            />
        </div>

    <main class="max-w-7xl mx-auto px-4 py-8 flex-grow w-full">
        <div class="flex gap-2 overflow-x-auto pb-4 mb-8" id="categories-container">
            <button onclick="filterCategory('all', this)" class="cat-btn px-4 py-2 rounded-xl font-semibold text-xs whitespace-nowrap bg-amber-500 text-gray-950">الكل</button>
            <button onclick="filterCategory('main', this)" class="cat-btn px-4 py-2 rounded-xl font-semibold text-xs whitespace-nowrap bg-gray-800 text-gray-400">الأطباق الرئيسية</button>
            <button onclick="filterCategory('grills', this)" class="cat-btn px-4 py-2 rounded-xl font-semibold text-xs whitespace-nowrap bg-gray-800 text-gray-400">المشويات</button>
            <button onclick="filterCategory('fish', this)" class="cat-btn px-4 py-2 rounded-xl font-semibold text-xs whitespace-nowrap bg-gray-800 text-gray-400">الأسماك</button>
            <button onclick="filterCategory('appetizers', this)" class="cat-btn px-4 py-2 rounded-xl font-semibold text-xs whitespace-nowrap bg-gray-800 text-gray-400">المعجنات والمقبلات</button>
            <button onclick="filterCategory('bakery', this)" class="cat-btn px-4 py-2 rounded-xl font-semibold text-xs whitespace-nowrap bg-gray-800 text-gray-400">المخبوزات والخبز</button>
            <button onclick="filterCategory('sandwiches', this)" class="cat-btn px-4 py-2 rounded-xl font-semibold text-xs whitespace-nowrap bg-gray-800 text-gray-400">السندويتشات</button>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="products-grid"></div>
    </main>

    <!-- نافذة السلة -->
    <div id="cart-modal" class="fixed inset-0 z-50 flex justify-end bg-black/70 hidden">
        <div class="w-full max-w-md bg-gray-900 text-white h-full flex flex-col shadow-2xl">
            <div class="p-4 bg-gray-950 border-b border-gray-800 flex justify-between items-center">
                <h2 class="font-bold">سلة الشراء</h2>
                <button onclick="closeCart()" class="text-gray-400 text-lg">✕</button>
            </div>
            <div class="flex-1 overflow-y-auto p-4 space-y-3" id="cart-items"></div>
            <div class="p-4 bg-gray-950 border-t border-gray-800 space-y-3" id="cart-footer">
                <input type="text" id="customer-name" placeholder="الاسم الكريم" class="w-full p-2 bg-gray-900 border border-gray-700 rounded text-white text-xs" />
                <div class="flex gap-2">
                    <button onclick="setDelivery('pickup')" id="btn-pickup" class="flex-1 p-2 border rounded text-xs bg-amber-500 text-black">استلام</button>
                    <button onclick="setDelivery('delivery')" id="btn-delivery" class="flex-1 p-2 border rounded text-xs bg-gray-900 text-gray-400">توصيل</button>
                </div>
                <div id="delivery-options" class="hidden space-y-2 text-xs relative">
                    <p class="text-gray-400 text-[10px]">الانطلاق من: 4704 Chaucer Dr, Greensboro, NC</p>
                    <input type="text" id="delivery-address" placeholder="اكتب اسم الشارع أو العنوان..." oninput="searchRealAddress(this.value)" class="w-full p-2 bg-gray-900 border border-gray-700 rounded text-white" />
                    <div id="suggestions" class="suggestions-list hidden"></div>
                    <p id="delivery-text" class="text-amber-400 font-bold">الرجاء إدخال الشارع واختياره من القائمة لحساب المسافة...</p>
                </div>
                <button onclick="sendWhatsAppOrder()" class="w-full bg-green-600 text-white py-3 rounded-xl font-bold text-xs">إرسال الطلب عبر الواتساب</button>
            </div>
        </div>
    </div>

            { id: 23, name: "فطائر صدر الدجاج", category: "appetizers", price: 3.5, image: "https://images.unsplash.com/photo-1577968897966-3d4325b36b61?auto=format&fit=crop&w=800&q=80" },
            { id: 24, name: "فليفلة", category: "appetizers", price: 2, image: "https://images.unsplash.com/photo-1577968897966-3d4325b36b61?auto=format&fit=crop&w=800&q=80" },
            { id: 25, name: "خبز عراقي (تنور)", category: "bakery", price: 1.5, image: "khubz-tannour.jpg" },
            { id: 26, name: "خبز عروك", category: "bakery", price: 3, image: "orook.jpg" },
            { id: 27, name: "صمون عراقي / بربري", category: "bakery", price: 2, image: "uzbek-bread.jpg" },
            { id: 28, name: "لفة خميرة", category: "bakery", price: 2, image: "https://images.unsplash.com/photo-1509440159596-0249088772ff?auto=format&fit=crop&w=800&q=80" },
            { id: 29, name: "كعك السمسم", category: "bakery", price: 5, image: "https://images.unsplash.com/photo-1587314168485-3236d6710814?auto=format&fit=crop&w=800&q=80" },
            { id: 30, name: "الكليچة العراقية", category: "bakery", price: 12, image: "https://images.unsplash.com/photo-1587314168485-3236d6710814?auto=format&fit=crop&w=800&q=80" },
            { id: 31, name: "ساندويچ فلافل", category: "sandwiches", price: 8, image: "https://images.unsplash.com/photo-1561758033-d89a9ad46330?auto=format&fit=crop&w=800&q=80" },
            { id: 32, name: "ساندويچ تكة دجاج", category: "sandwiches", price: 12, image: "https://images.unsplash.com/photo-1561758033-d89a9ad46330?auto=format&fit=crop&w=800&q=80" },
            { id: 33, name: "ساندويچ تكة لحم", category: "sandwiches", price: 14, image: "https://images.unsplash.com/photo-1561758033-d89a9ad46330?auto=format&fit=crop&w=800&q=80" },
            { id: 34, name: "ساندويچ كباب شوي", category: "sandwiches", price: 11, image: "kebab.jpg" }
        ];

        var cart = [];
        var currentCategory = 'all';
        var deliveryMode = 'pickup';
        var calculatedMiles = -1;
        
        var originLat = 36.0468;
        var originLon = -79.8833;

        function renderProducts() {
            var grid = document.getElementById('products-grid');
            var query = document.getElementById('search-input').value.toLowerCase();
            var html = '';
            
            for (var i = 0; i < products.length; i++) {
                var p = products[i];
                var matchCat = (currentCategory === 'all' || p.category === currentCategory);
                var matchQuery = p.name.toLowerCase().indexOf(query) !== -1;
                
                if (matchCat && matchQuery) {
                    html += '<div class="bg-gray-900 border border-gray-800 rounded-2xl overflow-hidden shadow-lg flex flex-col">' +
                        '<div class="relative h-48 bg-gray-950">' +
                            '<img src="' + p.image + '" alt="' + p.name + '" class="w-full h-full object-cover">' +
                            '<span class="absolute top-3 left-3 bg-black/70 px-3 py-1 rounded-full text-xs font-bold text-amber-400">$' + p.price.toFixed(2) + '</span>' +
                        '</div>' +
                        '<div class="p-5 flex-1 flex flex-col justify-between">' +
                            '<h3 class="font-bold text-lg text-white mb-4">' + p.name + '</h3>' +
                            '<button onclick="addToCart(' + p.id + ')" class="w-full bg-amber-500 hover:bg-amber-600 text-gray-950 font-bold py-2 rounded-xl text-xs">' +
                                'إضافة إلى السلة' +
                            '</button>' +
                        '</div>' +
                    '</div>';
                }
            }
            grid.innerHTML = html;
        }

        function filterCategory(cat, btn) {
            currentCategory = cat;
            var buttons = document.querySelectorAll('.cat-btn');
            for (var i = 0; i < buttons.length; i++) {
                buttons[i].className = "cat-btn px-4 py-2 rounded-xl font-semibold text-xs whitespace-nowrap bg-gray-800 text-gray-400";
            }
            btn.className = "cat-btn px-4 py-2 rounded-xl font-semibold text-xs whitespace-nowrap bg-amber-500 text-gray-950";
            renderProducts();
        }

        function addToCart(id) {
            var found = false;
            for (var i = 0; i < cart.length; i++) {
                if (cart[i].id === id) {
                    cart[i].quantity += 1;
                    found = true;
                    break;
                }
            }
            if (!found) {
                for (var j = 0; j < products.length; j++) {
                    if (products[j].id === id) {
                        cart.push({ id: products[j].id, name: products[j].name, price: products[j].price, quantity: 1 });
                        break;
                    }
                }
            }
            updateCartUI();
            openCart();
        }

        function updateQuantity(id, delta) {
            for (var i = 0; i < cart.length; i++) {
                if (cart[i].id === id) {
                    cart[i].quantity += delta;
                    if (cart[i].quantity <= 0) {
                        cart.splice(i, 1);
                    }
                    break;
                }
            }
            updateCartUI();
        }

        var searchTimeout;
        function searchRealAddress(query) {
            clearTimeout(searchTimeout);
            var sugBox = document.getElementById('suggestions');
            if (query.length < 2) {
                sugBox.classList.add('hidden');
                return;
            }

            searchTimeout = setTimeout(function() {
                var url = 'https://nominatim.openstreetmap.org/search?format=json&q=' + encodeURIComponent(query + ', Greensboro, NC') + '&limit=6';
                fetch(url)
                    .then(response => response.json())
                    .then(data => {
                        var html = '';
                        for (var i = 0; i < data.length; i++) {
                            var name = data[i].display_name;
                            html += '<div class="suggestion-item" onclick="selectRealAddress(\'' + name.replace(/'/g, "") + '\', ' + data[i].lat + ', ' + data[i].lon + ')">' + name + '</div>';
                        }
                        if (html) {
                            sugBox.innerHTML = html;
                            sugBox.classList.remove('hidden');
                        } else {
                            sugBox.classList.add('hidden');
                        }
                    }).catch(err => console.log(err));
            }, 300);
        }

        function selectRealAddress(addressText, lat, lon) {
            document.getElementById('delivery-address').value = addressText;
            document.getElementById('suggestions').classList.add('hidden');

            if (addressText.toLowerCase().indexOf('chaucer') !== -1) {
                calculatedMiles = 0.0;
                updateCartUI();
                return;
            }

            document.getElementById('delivery-text').innerText = 'جاري حساب مسافة القيادة الفعلية...';

            // استخدام مسافة القيادة الحقيقية الصافية من OSRM دون أي معاملات ضرب تقريبية
            var osrmUrl = 'https://router.project-osrm.org/route/v1/driving/' + originLon + ',' + originLat + ';' + lon + ',' + lat + '?overview=false';
            
            fetch(osrmUrl)
                .then(response => response.json())
                .then(data => {
                    if (data.routes && data.routes.length > 0) {
                        var meters = data.routes[0].distance;
                        var miles = meters / 1609.344; // تحويل دقيق وصافي للأميال الفعلية عبر الطرق
                        calculatedMiles = parseFloat(miles.toFixed(1));
                        if (calculatedMiles < 0.3) calculatedMiles = 0.0;
                        updateCartUI();
                    } else {
                        fallbackDirectDistance(lat, lon);
                    }
                })
                .catch(err => {
                    fallbackDirectDistance(lat, lon);
                });
        }

        function fallbackDirectDistance(lat, lon) {
            var R = 3958.8;
            var dLat = (lat - originLat) * Math.PI / 180;
            var dLon = (lon - originLon) * Math.PI / 180;
            var a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                    Math.cos(originLat * Math.PI / 180) * Math.cos(lat * Math.PI / 180) *
                    Math.sin(dLon/2) * Math.sin(dLon/2);
            var c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            calculatedMiles = parseFloat((R * c * 1.25).toFixed(1)); // معامل هندسي طبيعي للطرق عند انقطاع الخدمة
            if (calculatedMiles < 0.3) calculatedMiles = 0.0;
            updateCartUI();
        }

        function calculateDeliveryFee() {
            if (deliveryMode === 'pickup') return 0;
            if (calculatedMiles < 0) return 0;
            if (calculatedMiles > 30) return -1;
            if (calculatedMiles <= 15) return 0;
            return (calculatedMiles - 15) * 1;
        }

        function updateCartUI() {
            var badge = document.getElementById('cart-badge');
            var totalQty = 0;
            for (var i = 0; i < cart.length; i++) {
                totalQty += cart[i].quantity;
            }

            if (totalQty > 0) {
                badge.innerText = totalQty;
                badge.classList.remove('hidden');
            } else {
                badge.classList.add('hidden');
            }

            var container = document.getElementById('cart-items');
            if (cart.length === 0) {
                container.innerHTML = '<p class="text-gray-400 text-center text-xs py-8">السلة فارغة</p>';
                document.getElementById('cart-footer').style.display = 'none';
                return;
            }
            document.getElementById('cart-footer').style.display = 'block';

            var subtotal = 0;
            var html = '';
            for (var j = 0; j < cart.length; j++) {
                var item = cart[j];
                subtotal += (item.price * item.quantity);
                html += '<div class="flex justify-between items-center bg-gray-800 p-2 rounded-lg text-xs">' +
                    '<span>' + item.name + ' ($' + item.price + ')</span>' +
                    '<div class="flex items-center gap-2">' +
                        '<button onclick="updateQuantity(' + item.id + ', -1)" class="px-2 bg-gray-700 rounded">-</button>' +
                        '<span>' + item.quantity + '</span>' +
                        '<button onclick="updateQuantity(' + item.id + ', 1)" class="px-2 bg-gray-700 rounded">+</button>' +
                    '</div>' +
                '</div>';
            }

            var deliveryFee = calculateDeliveryFee();
            var deliveryTextElem = document.getElementById('delivery-text');

            if (deliveryMode === 'delivery') {
                if (calculatedMiles >= 0) {
                    if (deliveryFee === -1) {
                        deliveryTextElem.innerText = 'مسافة القيادة: ' + calculatedMiles + ' ميل (عذراً، التوصيل غير متاح لأكثر من 30 ميل)';
                        deliveryTextElem.className = 'text-red-400 font-bold';
                    } else {
                        var feeStr = deliveryFee === 0 ? 'مجاني 🎁' : '$' + deliveryFee.toFixed(2);
                        deliveryTextElem.innerText = 'مسافة القيادة الفعلية: ' + calculatedMiles + ' ميل (التوصيل: ' + feeStr + ')';
                        deliveryTextElem.className = 'text-amber-400 font-bold';
                    }
                } else {
                    deliveryTextElem.innerText = 'الرجاء كتابة واختيار الشارع من القائمة المنسدلة لحساب المسافة';
                    deliveryTextElem.className = 'text-amber-400 font-bold';
                }
            }

            var finalTotal = subtotal + (deliveryMode === 'delivery' && deliveryFee > 0 ? deliveryFee : 0);

            html += '<div class="bg-gray-950 p-3 rounded-lg text-xs space-y-1 mt-3 border border-gray-800">' +
                '<div class="flex justify-between text-gray-400"><span>المجموع الفرعي:</span><span>$' + subtotal.toFixed(2) + '</span></div>' +
                (deliveryMode === 'delivery' && deliveryFee !== -1 && calculatedMiles >= 0 ? '<div class="flex justify-between text-amber-400"><span>رسوم التوصيل:</span><span>' + (deliveryFee === 0 ? 'مجاني' : '$' + deliveryFee.toFixed(2)) + '</span></div>' : '') +
                '<div class="flex justify-between font-bold text-white text-sm pt-1 border-t border-gray-800"><span>الإجمالي النهائي:</span><span>$' + (deliveryFee === -1 ? subtotal.toFixed(2) : finalTotal.toFixed(2)) + '</span></div>' +
            '</div>';

            container.innerHTML = html;
        }

        function openCart() {
            document.getElementById('cart-modal').classList.remove('hidden');
            updateCartUI();
        }

        function closeCart() {
            document.getElementById('cart-modal').classList.add('hidden');
        }

        function setDelivery(mode) {
            deliveryMode = mode;
            var btnPickup = document.getElementById('btn-pickup');
            var btnDelivery = document.getElementById('btn-delivery');
            var options = document.getElementById('delivery-options');

            if (mode === 'pickup') {
                btnPickup.className = "flex-1 p-2 border rounded text-xs bg-amber-500 text-black";
                btnDelivery.className = "flex-1 p-2 border rounded text-xs bg-gray-900 text-gray-400";
                options.classList.add('hidden');
                calculatedMiles = -1;
            } else {
                btnDelivery.className = "flex-1 p-2 border rounded text-xs bg-amber-500 text-black";
                btnPickup.className = "flex-1 p-2 border rounded text-xs bg-gray-900 text-gray-400";
                options.classList.remove('hidden');
            }
            updateCartUI();
        }

        function sendWhatsAppOrder() {
            var name = document.getElementById('customer-name').value;
            if (!name) {
                alert("يرجى إدخال اسمك لتأكيد الطلب.");
                return;
            }

            var deliveryFee = calculateDeliveryFee();
            if (deliveryMode === 'delivery' && (calculatedMiles < 0 || deliveryFee === -1)) {
                alert("يرجى اختيار عنوان صحيح من القائمة المقترحة ضمن نطاق 30 ميلاً.");
                return;
            }

            var subtotal = 0;
            for (var i = 0; i < cart.length; i++) {
                subtotal += (cart[i].price * cart[i].quantity);
            }
            var total = subtotal + (deliveryMode === 'delivery' && deliveryFee > 0 ? deliveryFee : 0);

            var msg = "طلب جديد من أكلاتنا\n";
            msg += "الاسم: " + name + "\n";
            msg += "النوع: " + (deliveryMode === 'delivery' ? "توصيل للمنزل" : "استلام من المحل") + "\n";
            if (deliveryMode === 'delivery') {
                msg += "من عنوان: 4704 Chaucer Dr, Greensboro, NC 27407\n";
                msg += "إلى عنوان الزبون: " + (document.getElementById('delivery-address').value || 'غير محدد') + "\n";
                msg += "مسافة القيادة الفعلية: " + calculatedMiles + " ميل\n";
            }
            msg += "--- الطلبات ---\n";
            for (var j = 0; j < cart.length; j++) {
                msg += (j + 1) + ". " + cart[j].name + " x" + cart[j].quantity + " = $" + (cart[j].price * cart[j].quantity) + "\n";
            }
            msg += "---------------\n";
            msg += "المجموع: $" + subtotal.toFixed(2) + "\n";
            if (deliveryMode === 'delivery') {
                msg += "التوصيل: " + (deliveryFee === 0 ? "مجاني" : "$" + deliveryFee.toFixed(2)) + "\n";
            }
            msg += "الإجمالي النهائي: $" + total.toFixed(2);

            window.open("https://wa.me/13369448034?text=" + encodeURIComponent(msg), '_blank');
        }

        renderProducts();
    </script>
</body>
