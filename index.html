<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أكلاتنا - طبخ بيتي عراقي في جرينزبورو</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Cairo', sans-serif; background-color: #0b0f19; color: #f3f4f6; min-height: 100vh; display: flex; flex-direction: column; padding-bottom: 40px; }
        
        header { background-color: #111827; border-bottom: 1px solid #1f2937; position: sticky; top: 0; z-index: 30; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.5); }
        .header-container { max-width: 1200px; margin: 0 auto; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; }
        
        .logo-box { width: 48px; height: 48px; border-radius: 50%; background-color: #059669; border: 2px solid #34d399; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        
        .cart-btn { background-color: #f59e0b; color: #030712; font-weight: bold; padding: 8px 16px; border-radius: 8px; border: none; cursor: pointer; display: flex; align-items: center; gap: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); position: relative; font-size: 14px; }
        .cart-badge { position: absolute; top: -5px; right: -5px; background-color: #dc2626; color: white; font-size: 11px; width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        .hidden { display: none !important; }

        .hero { position: relative; padding: 80px 16px; text-align: center; background-color: #030712; min-height: 420px; display: flex; flex-direction: column; justify-content: flex-end; overflow: hidden; border-bottom: 1px solid #1f2937; }
        .hero-bg { position: absolute; inset: 0; background-size: cover; background-position: center; transition: opacity 2.5s ease-in-out, transform 8s ease-out; opacity: 0; z-index: 1; transform: scale(1); }
        .hero-bg.active { opacity: 1; transform: scale(1.05); }
        .hero-content { position: relative; z-index: 10; max-width: 800px; margin: 0 auto; padding-bottom: 20px; }
        .hero-title { font-size: clamp(3rem, 8vw, 6rem); font-weight: 900; color: #fbbf24; margin-bottom: 4px; text-shadow: 0 6px 6px rgba(0,0,0,0.95); }
        .hero-subtitle { font-size: clamp(1.2rem, 3vw, 1.8rem); font-weight: 800; color: #ffffff; margin-bottom: 24px; text-shadow: 0 3px 3px rgba(0,0,0,0.95); }
        
        .search-input { width: 100%; max-width: 500px; background-color: rgba(3,7,18,0.9); border: 1px solid rgba(245,158,11,0.6); border-radius: 12px; padding: 12px 20px; color: white; font-size: 14px; outline: none; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5); }

        .info-bar { background-color: #111827; border-top: 1px solid rgba(245,158,11,0.3); border-bottom: 1px solid rgba(245,158,11,0.3); padding: 12px 16px; text-align: center; }
        .info-content { max-width: 1200px; margin: 0 auto; display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 24px; font-size: 13px; font-weight: bold; color: #fde68a; }

        main { max-width: 1200px; margin: 0 auto; padding: 32px 16px; width: 100%; flex-grow: 1; }
        
        .categories { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 16px; margin-bottom: 32px; justify-content: center; flex-wrap: wrap; }
        .cat-btn { padding: 8px 16px; border-radius: 12px; font-weight: 600; font-size: 12px; white-space: nowrap; cursor: pointer; border: none; background-color: #1f2937; color: #9ca3af; transition: 0.2s; }
        .cat-btn.active { background-color: #fbbf24; color: #030712; font-weight: bold; }

        /* شبكة الكروت الثابتة والمضمونة 100% بدون اعتماد على تايليند خارجية */
        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 24px; width: 100%; }
        .product-card { background-color: #111827; border: 1px solid #1f2937; border-radius: 16px; overflow: hidden; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.3); display: flex; flex-direction: column; cursor: pointer; transition: border-color 0.2s; }
        .product-card:hover { border-color: rgba(245,158,11,0.5); }
        .product-img-box { position: relative; height: 240px; background-color: #030712; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .product-img { width: 100%; height: 100%; object-fit: cover; }
        .product-price-tag { position: absolute; top: 12px; left: 12px; background-color: rgba(0,0,0,0.75); padding: 4px 12px; border-radius: 9999px; font-size: 12px; font-weight: bold; color: #fbbf24; z-index: 10; }
        .product-info { padding: 16px; flex: 1; display: flex; flex-direction: column; justify-content: space-between; text-align: center; background-color: #111827; }
        .product-title { font-weight: 800; font-size: 16px; color: #ffffff; margin-bottom: 4px; }
        .product-note { font-size: 11px; color: rgba(253,230,138,0.9); margin-bottom: 8px; font-weight: bold; }
        .product-action { font-size: 12px; color: #fbbf24; font-weight: bold; }

        /* تأثير الدخان الواقعي والموزع حول الطبق في نافذة التفاصيل */
        .modal-overlay { position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center; background-color: rgba(0,0,0,0.8); padding: 16px; }
        .modal-content { width: 100%; max-width: 440px; background-color: #111827; color: white; border-radius: 16px; overflow: hidden; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.7); border: 1px solid #1f2937; display: flex; flex-direction: column; }
        .steam-container { position: absolute; inset: 0; pointer-events: none; z-index: 20; overflow: hidden; }
        .steam-particle { position: absolute; bottom: 10%; background: radial-gradient(circle, rgba(255,255,255,0.85) 0%, rgba(255,255,255,0.2) 50%, rgba(255,255,255,0) 80%); border-radius: 50%; filter: blur(4px); animation: riseSteamRealistic 3.5s infinite ease-in-out; }
        @keyframes riseSteamRealistic {
            0% { transform: translateY(15px) translateX(0) scale(0.3); opacity: 0; }
            30% { opacity: 0.6; }
            70% { opacity: 0.4; transform: translateY(-80px) translateX(15px) scale(2); }
            100% { transform: translateY(-160px) translateX(-15px) scale(3.5); opacity: 0; }
        }
        
        .modal-body { padding: 24px; display: flex; flex-direction: column; gap: 16px; }
        .modal-btn-main { width: 100%; background-color: #fbbf24; color: #030712; font-weight: 800; padding: 12px; border-radius: 12px; border: none; cursor: pointer; font-size: 14px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.3); display: flex; align-items: center; justify-content: center; gap: 8px; }
        
        .cart-drawer { position: fixed; inset: 0; z-index: 50; display: flex; justify-content: flex-end; background-color: rgba(0,0,0,0.8); }
        .cart-panel { width: 100%; max-width: 480px; background-color: #111827; color: white; height: 100%; display: flex; flex-direction: column; box-shadow: -10px 0 25px rgba(0,0,0,0.5); }
    </style>
</head>
<body>

    <header>
        <div class="header-container">
            <div style="display: flex; align-items: center; gap: 12px;">
                <div class="logo-box">
                    <svg viewBox="0 0 100 100" style="width: 100%; height: 100%; padding: 4px;">
                        <circle cx="50" cy="50" r="44" fill="none" stroke="#ffffff" stroke-width="3" />
                        <text x="50" y="48" font-family="'Cairo', sans-serif" font-size="22" font-weight="900" fill="#ffffff" text-anchor="middle">حلال</text>
                        <text x="50" y="68" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="1">HALAL</text>
                    </svg>
                </div>
                <div>
                    <p style="font-size: 12px; color: #9ca3af;">طبخ بيتي عراقي حلال 100% في Greensboro, NC</p>
                </div>
            </div>
            <div>
                <button onclick="openCart()" class="cart-btn">
                    <i class="fa-solid fa-utensils"></i>
                    <span>الصينية</span>
                    <span id="cart-badge" class="cart-badge hidden">0</span>
                </button>
            </div>
        </div>
    </header>

    <section class="hero">
        <div id="bg-layer-1" class="hero-bg active" style="background-image: url('gallery-1.jpg');"></div>
        <div id="bg-layer-2" class="hero-bg" style="background-image: url('gallery-2.jpg');"></div>

        <div class="hero-content">
            <h2 class="hero-title">أكلاتنا</h2>
            <p class="hero-subtitle">أطباق عراقية طازجة</p>
            <input 
                type="text" 
                id="search-input"
                placeholder="ابحث عن طبقك المفضّل..." 
                oninput="renderProducts()"
                class="search-input"
            />
        </div>
    </section>

    <div class="info-bar">
        <div class="info-content">
            <div style="display: flex; align-items: center; gap: 8px;">
                <i class="fa-solid fa-circle-check" style="color: #4ade80;"></i>
                <span>جميع اللحوم المستخدمة حلال 100%</span>
            </div>
            <span style="color: #4b5563;">|</span>
            <div style="display: flex; align-items: center; gap: 8px;">
                <i class="fa-solid fa-clock" style="color: #fbbf24;"></i>
                <span>يرجى إتمام الطلب قبل 24 ساعة</span>
            </div>
        </div>
    </div>

    <main>
        <div class="categories" id="categories-container">
            <button onclick="filterCategory('all', this)" class="cat-btn active">الكل</button>
            <button onclick="filterCategory('main', this)" class="cat-btn">الأطباق الرئيسية</button>
            <button onclick="filterCategory('grills', this)" class="cat-btn">المشويات</button>
            <button onclick="filterCategory('fish', this)" class="cat-btn">الأسماك</button>
            <button onclick="filterCategory('appetizers', this)" class="cat-btn">المعجنات والمقبلات</button>
            <button onclick="filterCategory('bakery', this)" class="cat-btn">المخبوزات والخبز</button>
            <button onclick="filterCategory('sandwiches', this)" class="cat-btn">السندويتشات</button>
        </div>

        <!-- شبكة الأطباق -->
        <div class="products-grid" id="products-grid"></div>
    </main>

    <!-- Modal عرض المنتج -->
    <div id="product-modal" class="modal-overlay hidden">
        <div class="modal-content">
            <div style="position: relative; height: 256px; background-color: #030712; display: flex; align-items: center; justify-content: center; overflow: hidden;">
                <div id="modal-img-container" style="width: 100%; height: 100%; position: relative; display: flex; align-items: center; justify-content: center;"></div>
                
                <button onclick="closeProductModal()" style="position: absolute; top: 12px; right: 12px; background-color: rgba(0,0,0,0.8); color: #fbbf24; padding: 6px 12px; border-radius: 10px; font-size: 12px; font-weight: bold; border: 1px solid rgba(245,158,11,0.3); cursor: pointer; z-index: 30; display: flex; align-items: center; gap: 6px;">
                    <i class="fa-solid fa-arrow-right"></i>
                    <span>العودة للقائمة</span>
                </button>
                
                <span id="modal-price" style="position: absolute; bottom: 12px; left: 12px; background-color: #fbbf24; color: #030712; padding: 4px 12px; border-radius: 9999px; font-size: 14px; font-weight: 900; z-index: 30;"></span>
            </div>
            
            <div class="modal-body">
                <h3 id="modal-title" style="font-size: 20px; font-weight: 800; color: #fbbf24;"></h3>
                <p id="modal-note" style="font-size: 12px; color: #fde68a; background-color: #030712; padding: 8px; border-radius: 8px; border: 1px solid #1f2937; display: none;"></p>
                
                <div id="dolma-size-section" style="display: none; flex-direction: column; gap: 8px;">
                    <label style="font-size: 12px; color: #9ca3af; font-weight: bold;">اختر حجم القدر:</label>
                    <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;">
                        <button type="button" onclick="setDolmaSize('small')" id="size-small-btn" style="padding: 8px; border-radius: 10px; border: 1px solid #374151; background-color: #030712; font-size: 12px; font-weight: bold; color: #d1d5db; cursor: pointer;">قدر صغير ($60)</button>
                        <button type="button" onclick="setDolmaSize('medium')" id="size-medium-btn" style="padding: 8px; border-radius: 10px; border: 1px solid #374151; background-color: #030712; font-size: 12px; font-weight: bold; color: #d1d5db; cursor: pointer;">قدر وسط ($80)</button>
                        <button type="button" onclick="setDolmaSize('large')" id="size-large-btn" style="padding: 8px; border-radius: 10px; border: 1px solid #374151; background-color: #030712; font-size: 12px; font-weight: bold; color: #d1d5db; cursor: pointer;">قدر كبير ($100)</button>
                    </div>
                </div>

                <div id="normal-qty-wrapper" style="display: flex; align-items: center; justify-content: space-between; border-top: 1px solid #1f2937; padding-top: 12px;">
                    <span style="font-size: 12px; color: #9ca3af; font-weight: bold;">الكمية المطلوبة:</span>
                    <div style="display: flex; align-items: center; gap: 12px; background-color: #030712; padding: 6px 12px; border-radius: 10px; border: 1px solid #374151;">
                        <button onclick="changeModalQty(-1)" style="width: 28px; height: 28px; background-color: #1f2937; color: white; border-radius: 6px; border: none; cursor: pointer; font-weight: bold;">-</button>
                        <span id="modal-qty" style="font-size: 14px; font-weight: 800; width: 120px; text-align: center; color: #fbbf24;">1</span>
                        <button onclick="changeModalQty(1)" style="width: 28px; height: 28px; background-color: #1f2937; color: white; border-radius: 6px; border: none; cursor: pointer; font-weight: bold;">+</button>
                    </div>
                </div>

                <div id="dynamic-serving-info" style="font-size: 12px; text-align: center; font-weight: bold; color: #4ade80; background-color: rgba(6, 78, 59, 0.4); padding: 8px; border-radius: 8px; border: 1px solid rgba(52, 211, 153, 0.3); display: none;"></div>

                <div id="extra-bread-section" style="display: none; flex-direction: column; gap: 8px; border-top: 1px solid #1f2937; padding-top: 12px;">
                    <p style="font-size: 12px; color: #fbbf24; font-weight: bold;">إضافات اختيارية مع الطبق:</p>
                    <div style="display: flex; align-items: center; justify-content: space-between; background-color: #030712; padding: 8px 12px; border-radius: 10px; border: 1px solid #1f2937;">
                        <span style="font-size: 12px; color: #d1d5db;">رغيف خبز إضافي ($1.00)</span>
                        <div style="display: flex; align-items: center; gap: 8px;">
                            <button onclick="changeExtra('extraBread', -1)" style="width: 24px; height: 24px; background-color: #1f2937; color: white; border-radius: 4px; border: none; cursor: pointer; font-size: 12px;">-</button>
                            <span id="extra-bread-qty" style="font-size: 12px; font-weight: bold; width: 24px; text-align: center; color: #fbbf24;">0</span>
                            <button onclick="changeExtra('extraBread', 1)" style="width: 24px; height: 24px; background-color: #1f2937; color: white; border-radius: 4px; border: none; cursor: pointer; font-size: 12px;">+</button>
                        </div>
                    </div>
                    <div style="display: flex; align-items: center; justify-content: space-between; background-color: #030712; padding: 8px 12px; border-radius: 10px; border: 1px solid #1f2937;">
                        <span style="font-size: 12px; color: #d1d5db;">قطعة صمون إضافية ($1.00)</span>
                        <div style="display: flex; align-items: center; gap: 8px;">
                            <button onclick="changeExtra('extraSamoon', -1)" style="width: 24px; height: 24px; background-color: #1f2937; color: white; border-radius: 4px; border: none; cursor: pointer; font-size: 12px;">-</button>
                            <span id="extra-samoon-qty" style="font-size: 12px; font-weight: bold; width: 24px; text-align: center; color: #fbbf24;">0</span>
                            <button onclick="changeExtra('extraSamoon', 1)" style="width: 24px; height: 24px; background-color: #1f2937; color: white; border-radius: 4px; border: none; cursor: pointer; font-size: 12px;">+</button>
                        </div>
                    </div>
                </div>

                <div style="display: flex; flex-direction: column; gap: 4px;">
                    <label style="font-size: 12px; color: #9ca3af; font-weight: bold;">ملاحظات على الطبق (اختياري):</label>
                    <input type="text" id="item-custom-note" value="" style="width: 100%; padding: 10px; background-color: #030712; border: 1px solid #374151; border-radius: 10px; color: white; font-size: 12px; outline: none;" />
                </div>

                <button onclick="confirmAddToCart()" class="modal-btn-main">
                    <i class="fa-solid fa-cart-plus"></i>
                    <span>أضف إلى الصينية</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Modal الصينية -->
    <div id="cart-modal" class="cart-drawer hidden">
        <div class="cart-panel">
            <div style="padding: 16px; background-color: #030712; border-bottom: 1px solid #1f2937; display: flex; justify-content: space-between; align-items: center;">
                <h2 style="font-weight: bold; color: #fbbf24; font-size: 16px;"><i class="fa-solid fa-utensils" style="margin-left: 8px;"></i> صينية الطلبات الشاملة</h2>
                <button onclick="closeCart()" style="color: #fbbf24; background: rgba(0,0,0,0.8); border: 1px solid rgba(245,158,11,0.4); padding: 6px 12px; border-radius: 10px; font-size: 12px; font-weight: bold; cursor: pointer;">العودة للقائمة</button>
            </div>
            
            <div id="cart-items" style="flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 16px;"></div>

            <div id="cart-footer" style="padding: 16px; background-color: #030712; border-top: 1px solid #1f2937; display: flex; flex-direction: column; gap: 12px;">
                <input type="text" id="customer-name" placeholder="الاسم الكريم" style="width: 100%; padding: 10px; background-color: #111827; border: 1px solid #374151; border-radius: 8px; color: white; font-size: 12px; outline: none;" />
                <button onclick="sendWhatsAppOrder()" style="width: 100%; background-color: #16a34a; color: white; padding: 12px; border-radius: 10px; font-weight: bold; font-size: 14px; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8
