<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أكلاتنا - طبخ بيتي عراقي في جرينزبورو</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #0b0f19; color: #f3f4f6; }
    </style>
</head>
<body class="min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;
        const WHATSAPP_NUMBER = "+13369448034";

        const CATEGORIES = [
            { id: "all", name: "الكل" },
            { id: "main", name: "الأطباق الرئيسية" },
            { id: "grills", name: "المشويات" },
            { id: "fish", name: "الأسماك" },
            { id: "appetizers", name: "المعجنات والمقبلات" },
            { id: "bakery", name: "المخبوزات والخبز" },
            { id: "sandwiches", name: "السندويتشات" }
        ];

        const PRODUCTS_DATA = [
            { id: 1, name: "الدولمة العراقية", category: "main", price: 45, description: "دولمة عراقية مشكلة طازجة ومطبوخة على الأصول.", image: "https://images.unsplash.com/photo-1544025162-d76694265947?auto=format&fit=crop&w=800&q=80" },
            { id: 2, name: "الباچة", category: "main", price: 60, description: "باچة عراقية ملغومة وطازجة بأسلوب بيتي أصيل.", image: "https://images.unsplash.com/photo-1546069901-ba9599a7e63c?auto=format&fit=crop&w=800&q=80" },
            { id: 3, name: "القوزي العراقي", category: "main", price: 70, description: "قوزي لحم فاخر مطبوخ بطريقة ممتازة.", image: "https://images.unsplash.com/photo-1544025162-d76694265947?auto=format&fit=crop&w=800&q=80" },
            { id: 4, name: "دجاج مع طبق رز أصفر", category: "main", price: 25, description: "دجاج محمر مع أرز أصفر معطر بالمكسرات والبهارات.", image: "https://images.unsplash.com/photo-1512058564366-18510be2db19?auto=format&fit=crop&w=800&q=80" },
            { id: 5, name: "دجاج مع طبق رز أحمر", category: "main", price: 25, description: "دجاج شهي مع أرز أحمر مطبوخ بصلصة الطماطم.", image: "https://images.unsplash.com/photo-1512058564366-18510be2db19?auto=format&fit=crop&w=800&q=80" },
            { id: 6, name: "القيمة مع الرز", category: "main", price: 20, description: "قيمة نجفية أصيلة مع الأرز المعطر.", image: "https://images.unsplash.com/photo-1546069901-ba9599a7e63c?auto=format&fit=crop&w=800&q=80" },
            { id: 7, name: "البرياني بالدجاج", category: "main", price: 28, description: "برياني دجاج مع الشعرية والمكسرات.", image: "https://images.unsplash.com/photo-1563379091339-03b21ab4a4f8?auto=format&fit=crop&w=800&q=80" },
            { id: 8, name: "البرياني باللحم", category: "main", price: 32, description: "برياني لحم فاخر مطبوخ بالبهارات العراقية.", image: "https://images.unsplash.com/photo-1563379091339-03b21ab4a4f8?auto=format&fit=crop&w=800&q=80" },
            { id: 9, name: "باقلاء بالدهن", category: "main", price: 18, description: "طبق باقلاء بالدهن الحر والبيض.", image: "https://images.unsplash.com/photo-1546069901-ba9599a7e63c?auto=format&fit=crop&w=800&q=80" },

            { id: 10, name: "كباب شوي", category: "grills", price: 30, description: "كباب عراقي مشوي على الفحم.", image: "https://images.unsplash.com/photo-1555939594-58d7cb561ad1?auto=format&fit=crop&w=800&q=80" },
            { id: 11, name: "تكة لحم", category: "grills", price: 35, description: "قطع تكة اللحم البقري المشوية الطرية.", image: "https://images.unsplash.com/photo-1555939594-58d7cb561ad1?auto=format&fit=crop&w=800&q=80" },
            { id: 12, name: "تكة دجاج", category: "grills", price: 25, description: "تكة دجاج متبلة ومشوية.", image: "https://images.unsplash.com/photo-1555939594-58d7cb561ad1?auto=format&fit=crop&w=800&q=80" },

            { id: 13, name: "السمك المشوي Tilapia", category: "fish", price: 28, description: "سمك تيلابيا مشوي على الطريقة العراقية.", image: "https://images.unsplash.com/photo-1519708227418-c8fd9a32b7a2?auto=format&fit=crop&w=800&q=80" },
            { id: 14, name: "السمك المقلي مع الرز الأحمر", category: "fish", price: 32, description: "سمك زبيدي مقلي يقدم مع الرز الأحمر.", image: "https://images.unsplash.com/photo-1519708227418-c8fd9a32b7a2?auto=format&fit=crop&w=800&q=80" },

            { id: 15, name: "كبة حلب", category: "appetizers", price: 3, description: "كبة رز مقرمشة محشوة باللحم والمكسرات.", image: "https://images.unsplash.com/photo-1577968897966-3d4325b36b61?auto=format&fit=crop&w=800&q=80" },
            { id: 16, name: "كبة الجريش", category: "appetizers", price: 3.5, description: "كبة جريش طازجة ومحشوة باللحم.", image: "https://images.unsplash.com/photo-1577968897966-3d4325b36b61?auto=format&fit=crop&w=800&q=80" },
            { id: 17, name: "بتيتة چاب", category: "appetizers", price: 3, description: "بتيتة چاب محشوة باللحم المتبل.", image: "https://images.unsplash.com/photo-1577968897966-3d4325b36b61?auto=format&fit=crop&w=800&q=80" },
            { id: 18, name: "بورڭ اللحم", category: "appetizers", price: 2.5, description: "بورڭ مقرمش محشو باللحم.", image: "https://images.unsplash.com/photo-1577968897966-3d4325b36b61?auto=format&fit=crop&w=800&q=80" },
            { id: 19, name: "بورڭ الجبن", category: "appetizers", price: 2.5, description: "بورڭ محشو بالجبنة اللذيذة.", image: "https://images.unsplash.com/photo-1577968897966-3d4325b36b61?auto=format&fit=crop&w=800&q=80" },
            { id: 20, name: "لحم بعجين", category: "appetizers", price: 4, description: "قرص لحم بعجين عراقي طازج.", image: "https://images.unsplash.com/photo-1577968897966-3d4325b36b61?auto=format&fit=crop&w=800&q=80" },
            { id: 21, name: "فطائر الجبن بالنعناع", category: "appetizers", price: 3, description: "فطائر مشوية بالجبن والنعناع.", image: "https://images.unsplash.com/photo-1577968897966-3d4325b36b61?auto=format&fit=crop&w=800&q=80" },
            { id: 22, name: "فطائر الزعتر", category: "appetizers", price: 2.5, description: "فطائر زعتر طازجة.", image: "https://images.unsplash.com/photo-1577968897966-3d4325b36b61?auto=format&fit=crop&w=800&q=80" },
            { id: 23, name: "فطائر صدر الدجاج", category: "appetizers", price: 3.5, description: "فطائر محشوة بقطع صدر الدجاج.", image: "https://images.unsplash.com/photo-1577968897966-3d4325b36b61?auto=format&fit=crop&w=800&q=80" },
            { id: 24, name: "فليفلة", category: "appetizers", price: 2, description: "مقبلات فليفلة شهية.", image: "https://images.unsplash.com/photo-1577968897966-3d4325b36b61?auto=format&fit=crop&w=800&q=80" },

            { id: 25, name: "صمون عراقي", category: "bakery", price: 1, description: "صمون عراقي حجري طازج.", image: "https://images.unsplash.com/photo-1509440159596-0249088772ff?auto=format&fit=crop&w=800&q=80" },
            { id: 26, name: "خبز عراقي (تنور)", category: "bakery", price: 1.5, description: "خبز تنور عراقي حار وطازج.", image: "https://images.unsplash.com/photo-1509440159596-0249088772ff?auto=format&fit=crop&w=800&q=80" },
            { id: 27, name: "خبز عروك", category: "bakery", price: 3, description: "خبز عروك عراقي باللحم والمخضرات.", image: "https://images.unsplash.com/photo-1509440159596-0249088772ff?auto=format&fit=crop&w=800&q=80" },
            { id: 28, name: "خبز بربري", category: "bakery", price: 2, description: "خبز بربري طازج ومحمص.", image: "https://images.unsplash.com/photo-1509440159596-0249088772ff?auto=format&fit=crop&w=800&q=80" },
            { id: 29, name: "لفة خميرة", category: "bakery", price: 2, description: "لفة خميرة طرية وهشة.", image: "https://images.unsplash.com/photo-1509440159596-0249088772ff?auto=format&fit=crop&w=800&q=80" },
            { id: 30, name: "كعك السمسم", category: "bakery", price: 5, description: "كعك مقرمش بالسمسم.", image: "https://images.unsplash.com/photo-1587314168485-3236d6710814?auto=format&fit=crop&w=800&q=80" },
            { id: 31, name: "الكليچة العراقية", category: "bakery", price: 12, description: "كليچة عراقية بالتمر والجوز.", image: "https://images.unsplash.com/photo-1587314168485-3236d6710814?auto=format&fit=crop&w=800&q=80" },

            { id: 32, name: "ساندويچ فلافل", category: "sandwiches", price: 8, description: "ساندويچ فلافل بالصمون مع الطحينة والعمبة.", image: "https://images.unsplash.com/photo-1561758033-d89a9ad46330?auto=format&fit=crop&w=800&q=80" },
            { id: 33, name: "ساندويچ تكة دجاج", category: "sandwiches", price: 12, description: "ساندويچ تكة دجاج مشوية مع السلطة.", image: "https://images.unsplash.com/photo-1561758033-d89a9ad46330?auto=format&fit=crop&w=800&q=80" },
            { id: 34, name: "ساندويچ تكة لحم", category: "sandwiches", price: 14, description: "ساندويچ تكة لحم بقري مشوية بالصمون.", image: "https://images.unsplash.com/photo-1561758033-d89a9ad46330?auto=format&fit=crop&w=800&q=80" },
            { id: 35, name: "ساندويچ كباب شوي", category: "sandwiches", price: 11, description: "ساندويچ كباب مشوي على الفحم.", image: "https://images.unsplash.com/photo-1561758033-d89a9ad46330?auto=format&fit=crop&w=800&q=80" }
        ];

        function App() {
            const [products, setProducts] = useState(() => {
                const saved = localStorage.getItem('aklatna_products_v11');
                return saved ? JSON.parse(saved) : PRODUCTS_DATA;
            });
            const [activeCategory, setActiveCategory] = useState("all");
            const [searchQuery, setSearchQuery] = useState("");
            const [cart, setCart] = useState([]);
            const [isCartOpen, setIsCartOpen] = useState(false);
            const [isAdminOpen, setIsAdminOpen] = useState(false);
            const [deliveryType, setDeliveryType] = useState("pickup");
            const [deliveryDistance, setDeliveryDistance] = useState(3);
            const [deliveryAddress, setDeliveryAddress] = useState("");
            const [customerName, setCustomerName] = useState("");

            const [newProdName, setNewProdName] = useState("");
            const [newProdCategory, setNewProdCategory] = useState("main");
            const [newProdDesc, setNewProdDesc] = useState("");
            const [newProdPrice, setNewProdPrice] = useState("");
            const [newProdImage, setNewProdImage] = useState("");

            useEffect(() => {
                localStorage.setItem('aklatna_products_v11', JSON.stringify(products));
            }, [products]);

            const deliveryFee = deliveryType === "delivery" ? Math.max(2, deliveryDistance * 1.5) : 0;

            const filteredProducts = useMemo(() => {
                return products.filter(product => {
                    const matchesCategory = activeCategory === "all" || product.category === activeCategory;
                    const matchesSearch = product.name.toLowerCase().includes(searchQuery.toLowerCase()) || 
                                          product.description.toLowerCase().includes(searchQuery.toLowerCase());
                    return matchesCategory && matchesSearch;
                });
            }, [products, activeCategory, searchQuery]);

            const addToCart = (product) => {
                setCart(prev => {
                    const existing = prev.find(item => item.id === product.id);
                    if (existing) {
                        return prev.map(item => item.id === product.id ? { ...item, quantity: item.quantity + 1 } : item);
                    }
                    return [...prev, { ...product, quantity: 1 }];
                });
                setIsCartOpen(true);
            };

            const updateCartQuantity = (id, delta) => {
                setCart(prev => prev.map(item => {
                    if (item.id === id) {
                        const newQty = item.quantity + delta;
                        return newQty > 0 ? { ...item, quantity: newQty } : null;
                    }
                    return item;
                }).filter(Boolean));
            };

            const cartSubtotal = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            const cartTotal = cartSubtotal + (cart.length > 0 ? deliveryFee : 0);

            const sendWhatsAppOrder = () => {
                if (cart.length === 0) return;
                if (!customerName) {
                    alert("يرجى إدخال اسمك لتأكيد الطلب.");
                    return;
                }

                let message = `🍽️ *طلب جديد من أكلاتنا (طبخ بيتي عراقي)* 🍽️\n`;
                message += `👤 *العميل:* ${customerName}\n`;
                message += `📍 *النوع:* ${deliveryType === "delivery" ? "توصيل للمنزل" : "استلام"}\n`;
                if (deliveryType === "delivery") {
                    message += `🏠 *العنوان:* ${deliveryAddress}\n`;
                    message += `🚗 *المسافة:* ${deliveryDistance} ميل\n`;
                }
                message += `--------------------------------\n`;
                cart.forEach((item, index) => {
                    message += `${index + 1}. ${item.name} x${item.quantity} = $${(item.price * item.quantity).toFixed(2)}\n`;
                });
                message += `--------------------------------\n`;
                message += `💰 *المجموع:* $${cartSubtotal.toFixed(2)}\n`;
                if (deliveryType === "delivery") message += `🚚 *التوصيل:* $${deliveryFee.toFixed(2)}\n`;
                message += `✅ *الإجمالي:* $${cartTotal.toFixed(2)}\n`;

                window.open(`https://wa.me/${WHATSAPP_NUMBER.replace('+', '')}?text=${encodeURIComponent(message)}`, '_blank');
            };

            const handleSaveProduct = (e) => {
                e.preventDefault();
                if (!newProdName || !newProdPrice) return;

                const newProd = {
                    id: Date.now(),
                    name: newProdName,
                    category: newProdCategory,
                    description: newProdDesc,
                    price: parseFloat(newProdPrice),
                    image: newProdImage || "https://images.unsplash.com/photo-1546069901-ba9599a7e63c?auto=format&fit=crop&w=800&q=80"
                };

                setProducts(prev => [newProd, ...prev]);
                setNewProdName("");
                setNewProdDesc("");
                setNewProdPrice("");
                setNewProdImage("");
                setIsAdminOpen(false);
            };

            return (
                <div className="min-h-screen flex flex-col pb-10">
                    <header className="bg-gray-900 border-b border-gray-800 sticky top-0 z-30 shadow-xl">
                        <div className="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
                            <div className="flex items-center space-x-3 space-x-reverse">
                                <div className="w-10 h-10 rounded-full bg-gradient-to-tr from-amber-500 to-red-600 flex items-center justify-center text-white text-xl font-bold">
                                    <i className="fa-solid fa-utensils"></i>
                                </div>
                                <div>
                                    <h1 className="text-2xl font-extrabold text-amber-400">أكلاتنا</h1>
                                    <p className="text-xs text-gray-400">طبخ بيتي عراقي في Greensboro, NC</p>
                                </div>
                            </div>
                            <div className="flex items-center space-x-3 space-x-reverse">
                                <button onClick={() => setIsAdminOpen(true)} className="bg-gray-800 text-amber-400 border border-amber-500/30 px-3 py-1.5 rounded-lg text-xs font-semibold">
                                    لوحة الإدارة
                                </button>
                                <button onClick={() => setIsCartOpen(true)} className="bg-amber-500 text-gray-950 font-bold px-4 py-1.5 rounded-lg text-sm flex items-center gap-2">
                                    <span>السلة</span>
                                    {cart.length > 0 && <span className="bg-red-600 text-white text-xs w-5 h-5 rounded-full flex items-center justify-center">{cart.reduce((s, i) => s + i.quantity, 0)}</span>}
                                </button>
                            </div>
                        </div>
                    </header>

                    {/* قسم العنوان مع صورتك الأصلية بحجمها الكامل والواضح */}
                    <section className="relative py-20 px-4 border-b border-gray-800 text-center bg-gray-950 bg-cover bg-center" style={{ backgroundImage: `url('PhotoGPT-8035f4a4803c4e32b4f7e8823f056397.png')` }}>
                        <div className="absolute inset-0 bg-black/70 backdrop-blur-[1px]"></div>
                        <div className="relative z-10 max-w-4xl mx-auto">
                            <h2 className="text-5xl md:text-7xl font-black text-amber-400 mb-3 tracking-wider drop-shadow-2xl">أكلاتنا</h2>
                            <p className="text-xl md:text-2xl font-bold text-white mb-6 drop-shadow-lg">أطباق عراقية طازجة</p>
                            <input 
                                type="text" 
                                placeholder="ابحث عن طبقك المفضّل..." 
                                value={searchQuery} 
                                onChange={(e) => setSearchQuery(e.target.value)}
                                className="w-full max-w-lg bg-gray-900/95 border border-amber-500/50 rounded-xl py-3 px-4 text-white text-sm focus:outline-none focus:border-amber-400 shadow-2xl"
                            />
                        </div>
                    </section>

                    <main className="max-w-7xl mx-auto px-4 py-8 flex-grow w-full">
                        <div className="flex gap-2 overflow-x-auto pb-4 mb-8">
                            {CATEGORIES.map(cat => (
                                <button key={cat.id} onClick={() => setActiveCategory(cat.id)} className={`px-4 py-2 rounded-xl font-semibold text-xs whitespace-nowrap ${activeCategory === cat.id ? "bg-amber-500 text-gray-950" : "bg-gray-800 text-gray-400"}`}>
                                    {cat.name}
                                </button>
                            ))}
                        </div>

                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                            {filteredProducts.map(product => (
                                <div key={product.id} className="bg-gray-900 border border-gray-800 rounded-2xl overflow-hidden shadow-lg flex flex-col">
                                    <div className="relative h-48 bg-gray-950">
                                        <img src={product.image} alt={product.name} className="w-full h-full object-cover" />
                                        <span className="absolute top-3 left-3 bg-black/70 px-3 py-1 rounded-full text-xs font-bold text-amber-400">${product.price.toFixed(2)}</span>
                                    </div>
                                    <div className="p-5 flex-1 flex flex-col justify-between">
                                        <div>
                                            <h3 className="font-bold text-base text-white">{product.name}</h3>
                                            <p className="text-gray-400 text-xs mt-2">{product.description}</p>
                                        </div>
                                        <button onClick={() => addToCart(product)} className="mt-4 w-full bg-amber-500 hover:bg-amber-600 text-gray-950 font-bold py-2 rounded-xl text-xs">
                                            إضافة إلى السلة
                                        </button>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </main>

                    {isCartOpen && (
                        <div className="fixed inset-0 z-50 flex justify-end bg-black/70">
                            <div className="w-full max-w-md bg-gray-900 text-white h-full flex flex-col shadow-2xl">
                                <div className="p-4 bg-gray-950 border-b border-gray-800 flex justify-between items-center">
                                    <h2 className="font-bold">سلة الشراء</h2>
                                    <button onClick={() => setIsCartOpen(false)} className="text-gray-400">إغلاق</button>
                                </div>
                                <div className="flex-1 overflow-y-auto p-4 space-y-3">
                                    {cart.map(item => (
                                        <div key={item.id} className="flex justify-between items-center bg-gray-800 p-2 rounded-lg text-xs">
                                            <span>{item.name} (${item.price})</span>
                                            <div className="flex items-center gap-2">
                                                <button onClick={() => updateCartQuantity(item.id, -1)} className="px-2 bg-gray-700 rounded">-</button>
                                                <span>{item.quantity}</span>
                                                <button onClick={() => updateCartQuantity(item.id, 1)} className="px-2 bg-gray-700 rounded">+</button>
                                            </div>
                                        </div>
                                    ))}
                                    {cart.length > 0 && (
                                        <div className="mt-4 space-y-2 text-xs">
                                            <input type="text" placeholder="الاسم الكريم" value={customerName} onChange={(e) => setCustomerName(e.target.value)} className="w-full p-2 bg-gray-950 border border-gray-700 rounded text-white" />
                                            <div className="flex gap-2">
                                                <button onClick={() => setDeliveryType("pickup")} className={`flex-1 p-2 border rounded ${deliveryType === "pickup" ? "bg-amber-500 text-black" : "bg-gray-950 text-gray-400"}`}>استلام</button>
                                                <button onClick={() => setDeliveryType("delivery")} className={`flex-1 p-2 border rounded ${deliveryType === "delivery" ? "bg-amber-500 text-black" : "bg-gray-950 text-gray-400"}`}>توصيل</button>
                                            </div>
                                            {deliveryType === "delivery" && (
                                                <>
                                                    <input type="text" placeholder="عنوان التوصيل" value={deliveryAddress} onChange={(e) => setDeliveryAddress(e.target.value)} className="w-full p-2 bg-gray-950 border border-gray-700 rounded text-white" />
                                                    <input type="range" min="1" max="25" value={deliveryDistance} onChange={(e) => setDeliveryDistance(parseInt(e.target.value))} className="w-full accent-amber-500" />
                                                    <p className="text-amber-400">المسافة: {deliveryDistance} ميل (التوصيل: ${deliveryFee})</p>
                                                </>
                                            )}
                                        </div>
                                    )}
                                </div>
                                {cart.length > 0 && (
                                    <div className="p-4 bg-gray-950 border-t border-gray-800">
                                        <button onClick={sendWhatsAppOrder} className="w-full bg-green-600 text-white py-3 rounded-xl font-bold text-xs">إرسال الطلب عبر الواتساب</button>
                                    </div>
                                )}
                            </div>
                        </div>
                    )}

                    {isAdminOpen && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 overflow-y-auto">
                            <div className="bg-gray-900 border border-gray-800 w-full max-w-lg rounded-2xl p-6 space-y-4">
                                <div className="flex justify-between items-center">
                                    <h3 className="font-bold text-amber-400">لوحة الإدارة - إضافة طبق</h3>
                                    <button onClick={() => setIsAdminOpen(false)} className="text-gray-400">إغلاق</button>
                                </div>
                                <form onSubmit={handleSaveProduct} className="space-y-3 text-xs">
                                    <input type="text" placeholder="اسم الطبق" value={newProdName} onChange={(e) => setNewProdName(e.target.value)} required className="w-full p-2 bg-gray-950 border border-gray-700 rounded text-white" />
                                    <select value={newProdCategory} onChange={(e) => setNewProdCategory(e.target.value)} className="w-full p-2 bg-gray-950 border border-gray-700 rounded text-white">
                                        {CATEGORIES.filter(c => c.id !== "all").map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
                                    </select>
                                    <input type="number" step="0.5" placeholder="السعر ($)" value={newProdPrice} onChange={(e) => setNewProdPrice(e.target.value)} required className="w-full p-2 bg-gray-950 border border-gray-700 rounded text-white" />
                                    <input type="url" placeholder="رابط الصورة (اختياري)" value={newProdImage} onChange={(e) => setNewProdImage(e.target.value)} className="w-full p-2 bg-gray-950 border border-gray-700 rounded text-white" />
                                    <textarea placeholder="الوصف" value={newProdDesc} onChange={(e) => setNewProdDesc(e.target.value)} className="w-full p-2 bg-gray-950 border border-gray-700 rounded text-white h-16"></textarea>
                                    <button type="submit" className="w-full bg-amber-500 text-black font-bold py-2 rounded">حفظ وإضافة</button>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
