    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #0b0f19; color: #f3f4f6; }
        .hero-bg {
            position: absolute;
            inset: 0;
            background-size: cover;
            background-position: center;
            transition: opacity 2.5s ease-in-out, transform 8s ease-out;
            opacity: 0;
            z-index: 1;
            transform: scale(1);
        }
        .hero-bg.active {
            opacity: 1;
            transform: scale(1.05);
        }
    </style>

<body class="min-h-screen flex flex-col pb-10">

        <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center space-x-3 space-x-reverse">
                <div class="w-12 h-12 rounded-full overflow-hidden flex items-center justify-center shadow-lg bg-emerald-600 border-2 border-emerald-400">
                    <svg viewBox="0 0 100 100" class="w-full h-full p-1">
                        <circle cx="50" cy="50" r="44" fill="none" stroke="#ffffff" stroke-width="3" />
                        <text x="50" y="48" font-family="'Cairo', sans-serif" font-size="22" font-weight="900" fill="#ffffff" text-anchor="middle">حلال</text>
                        <text x="50" y="68" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="1">HALAL</text>

                <button onclick="openCart()" class="bg-amber-500 hover:bg-amber-600 text-gray-950 font-bold px-4 py-2 rounded-lg text-sm flex items-center gap-2 shadow-lg transition-all relative">
                    <i class="fa-solid fa-utensils"></i>
                    <span>الصينية</span>
                    <span id="cart-badge" class="bg-red-600 text-white text-xs w-5 h-5 rounded-full flex items-center justify-center hidden">0</span>
                </button>
            </div>
        </div>
    </header>

    <section id="hero-section" class="relative py-20 px-4 border-b border-gray-800 text-center overflow-hidden bg-gray-950 min-h-[420px] flex flex-col justify-end">
        <div id="bg-layer-1" class="hero-bg active" style="background-image: url('gallery-1.jpg');"></div>
        <div id="bg-layer-2" class="hero-bg" style="background-image: url('gallery-2.jpg');"></div>

        <div class="relative z-10 max-w-4xl mx-auto pb-6">
            <h2 class="text-6xl md:text-9xl font-black text-amber-400 mb-1 tracking-wider drop-shadow-[0_6px_6px_rgba(0,0,0,0.95)]">أكلاتنا</h2>
            <p class="text-xl md:text-3xl font-extrabold text-white mb-8 drop-shadow-[0_3px_3px_rgba(0,0,0,0.95)]">أطباق عراقية طازجة</p>
            
            <input 
                type="text" 
                id="search-input"

            />
        </div>
    </section>

    <div class="bg-gray-900 border-y border-amber-500/30 py-3 px-4 shadow-inner">
        <div class="max-w-7xl mx-auto flex flex-wrap justify-center items-center gap-6 text-xs md:text-sm font-bold text-amber-300 text-center">
            <div class="flex items-center gap-2">
                <i class="fa-solid fa-circle-check text-green-400"></i>
                <span>جميع اللحوم المستخدمة حلال 100%</span>
            </div>
            <div class="hidden md:inline text-gray-600">|</div>
            <div class="flex items-center gap-2">
                <i class="fa-solid fa-clock text-amber-400"></i>
                <span>يرجى إتمام الطلب قبل 24 ساعة</span>
            </div>
        </div>
    </div>

    <main class="max-w-7xl mx-auto px-4 py-8 flex-grow w-full">
        <div class="flex gap-2 overflow-x-auto pb-4 mb-8 justify-center flex-wrap" id="categories-container">
            <button onclick="filterCategory('all', this)" class="cat-btn px-4 py-2 rounded-xl font-semibold text-xs whitespace-nowrap bg-amber-500 text-gray-950">الكل</button>
            <button onclick="filterCategory('main', this)" class="cat-btn px-4 py-2 rounded-xl font-semibold text-xs whitespace-nowrap bg-gray-800 text-gray-400">الأطباق الرئيسية</button>
            <button onclick="filterCategory('grills', this)" class="cat-btn px-4 py-2 rounded-xl font-semibold text-xs whitespace-nowrap bg-gray-800 text-gray-400">المشويات</button>
            <button onclick="filterCategory('fish', this)" class="cat-btn px-4 py-2 rounded-xl font-semibold text-xs whitespace-nowrap bg-gray-800 text-gray-400">الأسماك</button>
            <button onclick="filterCategory('appetizers', this)" class="cat-btn px-4 py-2 rounded-xl font-semibold text-xs whitespace-nowrap bg-gray-800 text-gray-400">المعجنات والمقبلات</button>

            <button onclick="filterCategory('sandwiches', this)" class="cat-btn px-4 py-2 rounded-xl font-semibold text-xs whitespace-nowrap bg-gray-800 text-gray-400">السندويتشات</button>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="products-grid"></div>
    </main>

    <!-- Modal عرض المنتج -->

                <div class="flex items-center justify-between pt-2 border-t border-gray-800">
                    <span class="text-xs text-gray-400 font-bold" id="modal-qty-label">الكمية المطلوبة:</span>
                    <div class="flex items-center gap-3 bg-gray-950 px-3 py-1.5 rounded-xl border border-gray-700">
                        <button onclick="changeModalQty(-1)" class="w-7 h-7 bg-gray-800 hover:bg-gray-700 text-white rounded-lg flex items-center justify-center font-bold text-sm">-</button>

                        <button onclick="changeModalQty(1)" class="w-7 h-7 bg-gray-800 hover:bg-gray-700 text-white rounded-lg flex items-center justify-center font-bold text-sm">+</button>
                    </div>
                </div>

                <div id="dynamic-serving-info" class="text-xs text-center font-bold text-emerald-400 bg-emerald-950/40 p-2 rounded-lg border border-emerald-500/30 hidden"></div>

                <!-- خيارات إضافية للخبز والصمون -->
                <div id="extra-bread-section" class="space-y-2 pt-2 border-t border-gray-800 hidden">
                    <p class="text-xs text-amber-400 font-bold">إضافات اختيارية مع الطبق:</p>
                    <div class="flex items-center justify-between bg-gray-950 p-2.5 rounded-xl border border-gray-800">
                        <span class="text-xs text-gray-300">رغيف خبز إضافي ($1.00)</span>
                        <div class="flex items-center gap-2">
                            <button onclick="changeExtra('extraBread', -1)" class="w-6 h-6 bg-gray-800 hover:bg-gray-700 text-white rounded flex items-center justify-center font-bold text-xs">-</button>
                            <span id="extra-bread-qty" class="text-xs font-bold w-6 text-center text-amber-400">0</span>
                            <button onclick="changeExtra('extraBread', 1)" class="w-6 h-6 bg-gray-800 hover:bg-gray-700 text-white rounded flex items-center justify-center font-bold text-xs">+</button>
                        </div>
                    </div>
                    <div class="flex items-center justify-between bg-gray-950 p-2.5 rounded-xl border border-gray-800">
                        <span class="text-xs text-gray-300">قطعة صمون إضافية ($1.00)</span>
                        <div class="flex items-center gap-2">
                            <button onclick="changeExtra('extraSamoon', -1)" class="w-6 h-6 bg-gray-800 hover:bg-gray-700 text-white rounded flex items-center justify-center font-bold text-xs">-</button>
                            <span id="extra-samoon-qty" class="text-xs font-bold w-6 text-center text-amber-400">0</span>

                <div class="space-y-1">
                    <label class="text-xs text-gray-400 font-bold block">ملاحظات على الطبق (اختياري):</label>
                    <input type="text" id="item-custom-note" value="" placeholder="" class="w-full p-2.5 bg-gray-950 border border-gray-700 rounded-xl text-white text-xs focus:border-amber-400 focus:outline-none" />
                </div>

                <button onclick="confirmAddToCart()" class="w-full bg-amber-500 hover:bg-amber-600 text-gray-950 font-extrabold py-3 rounded-xl text-sm shadow-lg flex items-center justify-center gap-2">
                    <i class="fa-solid fa-cart-plus"></i>
                    <span>أضف إلى الصينية</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Modal الصينية -->
    <div id="cart-modal" class="fixed inset-0 z-50 flex justify-end bg-black/80 hidden">
        <div class="w-full max-w-lg bg-gray-900 text-white h-full flex flex-col shadow-2xl overflow-hidden">
            <div class="p-4 bg-gray-950 border-b border-gray-800 flex justify-between items-center">
                <h2 class="font-bold text-amber-400 text-base"><i class="fa-solid fa-utensils ml-2"></i> صينية الطلبات الشاملة</h2>
                
                <button onclick="closeCart()" class="text-amber-400 hover:text-amber-300 text-xs font-bold bg-black/80 border border-amber-500/40 px-3 py-1.5 rounded-xl flex items-center gap-1.5 transition-all shadow">
                    <i class="fa-solid fa-arrow-right"></i>
                    <span>العودة للقائمة</span>
                </button>
            </div>
            
            <div class="flex-1 overflow-y-auto p-4 space-y-4" id="cart-items"></div>

            <div class="p-4 bg-gray-950 border-t border-gray-800 space-y-3" id="cart-footer">
                <input type="text" id="customer-name" placeholder="الاسم الكريم" class="w-full p-2.5 bg-gray-900 border border-gray-700 rounded-lg text-white text-xs focus:border-amber-400 focus:outline-none" />

                <button onclick="sendWhatsAppOrder()" class="w-full bg-green-600 hover:bg-green-700 text-white py-3 rounded-xl font-bold text-sm shadow-lg flex items-center justify-center gap-2">
                    <i class="fa-brands fa-whatsapp text-lg"></i>

                </button>
            </div>
        </div>
    </div>

            { id: 26, name: "خبز عراقي (تنور)", category: "bakery", price: 20, image: "khubz-tannour.jpg", unitPrice: 5, minQty: 4, stepQty: 4, unitLabel: "ربطة (5 أرغفة)", note: "20$ / 4 ربطات (الحد الأدنى) (كل ربطة 5 أرغفة)" },

            { id: 29, name: "لفة خميرة", category: "bakery", price: 10, image: "laffat khameera.jpg", unitPrice: 0.5, minQty: 20, stepQty: 20, unitLabel: "قطعة", note: "10$ / 20 قطعة (الحد الأدنى)" },
            { id: 30, name: "كعك بالسمسم", category: "bakery", price: 10, image: "laffat khameera 1.jpg", unitPrice: 0.5, minQty: 20, stepQty: 20, unitLabel: "قطعة", note: "10$ / 20 قطعة (الحد الأدنى)" },
            { id: 31, name: "الكليچة", category: "bakery", price: 20, image: "kleacha.png", unitPrice: 20, minQty: 1, stepQty: 1, unitLabel: "باوند", note: "20$ / 1 باوند (الحد الأدنى)" },

            { id: 32, name: "ساندويچ فلافل", category: "sandwiches", price: 8, image: "falafel-plate.jpg", note: "" },
            { id: 33, name: "ساندويچ تكة دجاج", category: "sandwiches", price: 12, image: "chicken tecca.jpg", note: "" },
            { id: 34, name: "ساندويچ تكة لحم", category: "sandwiches", price: 14, image: "meat tecca.jpg", note: "" },
            { id: 35, name: "ساندويچ كباب شوي", category: "sandwiches", price: 11, image: "kebab.jpg", note: "" }
        ];

        var heroImages = [
            "gallery-1.jpg", "gallery-2.jpg", "gallery-3.jpg", "gallery-4.jpg",
            "gallery-5.jpg", "gallery-6.jpg", "gallery-7.jpg", "gallery-8.jpg",
            "gallery-9.jpg", "gallery-10.jpg", "gallery-11.jpg", "gallery-12.jpg",
            "gallery-13.jpg", "gallery-14.jpg"
        ];
        
        var currentImgIndex = 0;
        var isLayerOneActive = true;

        function smoothChangeHeroBackground() {
            var layer1 = document.getElementById('bg-layer-1');
            var layer2 = document.getElementById('bg-layer-2');
            if (!layer1 || !layer2) return;

            currentImgIndex = (currentImgIndex + 1) % heroImages.length;
            var nextImage = heroImages[currentImgIndex];

            if (isLayerOneActive) {
                layer2.style.backgroundImage = "url('" + nextImage + "')";
                layer1.classList.remove('active');
                layer2.classList.add('active');
            } else {
                layer1.style.backgroundImage = "url('" + nextImage + "')";
                layer2.classList.remove('active');
                layer1.classList.add('active');
            }
            isLayerOneActive = !isLayerOneActive;
        }

        setInterval(smoothChangeHeroBackground, 4500);

        var cart = [];
        var currentCategory = 'all';
        var currentActiveProduct = null;
        var currentModalQty = 1;
        var extraBreadQty = 0;
        var extraSamoonQty = 0;

        function renderProducts() {
            var grid = document.getElementById('products-grid');
            if (!grid) return;
            var queryInput = document.getElementById('search-input');
            var query = (queryInput && queryInput.value) ? queryInput.value.toLowerCase().trim() : '';
            var html = '';
            
            for (var i = 0; i < products.length; i++) {
                var p = products[i];
                var matchCat = (currentCategory === 'all' || p.category === currentCategory);
                var matchQuery = (query === '' || p.name.toLowerCase().indexOf(query) !== -1);
                
                if (matchCat && matchQuery) {
                    var imgContent = '<img src="' + p.image + '" alt="' + p.name + '" class="w-full h-full object-cover" onerror="this.style.display=\'none\'; this.nextElementSibling.style.display=\'flex\';">' +
                                     '<div class="w-full h-full items-center justify-center bg-gray-900 text-amber-400 text-xs font-bold" style="display:none;">🍲 ' + p.name + '</div>';

                    var priceDisplay = p.price ? '$' + p.price.toFixed(2) : '';

                    html += '<div onclick="openProductModal(' + p.id + ')" class="bg-gray-900 border border-gray-800 rounded-2xl overflow-hidden shadow-lg flex flex-col cursor-pointer hover:border-amber-500/50 transition-all">' +
                        '<div class="relative h-60 bg-gray-950 flex items-center justify-center">' +
                            imgContent +
                            '<span class="absolute top-3 left-3 bg-black/75 px-3 py-1 rounded-full text-xs font-bold text-amber-400 z-10">' + priceDisplay + '</span>' +
                        '</div>' +
                        '<div class="p-4 flex-1 flex flex-col justify-between text-center bg-gray-900">' +
                            '<h3 class="font-extrabold text-base text-white mb-1">' + p.name + '</h3>' +
                            (p.note ? '<p class="text-[11px] text-amber-300/90 mb-2 font-bold">' + p.note + '</p>' : '') +
                            '<span class="text-xs text-amber-400 font-bold">اضغط للعرض والتفاصيل 🔍</span>' +
                        '</div>' +
                    '</div>';
                }
            }
            grid.innerHTML = html;
        }

        function filterCategory(cat, btn) {
            currentCategory = cat;
            var buttons = document.querySelectorAll('.cat-btn');
            for (var i = 0; i < buttons.length; i++) {
                buttons[i].className = "cat-btn px-4 py-2 rounded-xl font-semibold text-xs whitespace-nowrap bg-gray-800 text-gray-400";
            }
            if (btn) {
                btn.className = "cat-btn px-4 py-2 rounded-xl font-semibold text-xs whitespace-nowrap bg-amber-500 text-gray-950";
            }
            renderProducts();
        }

        function openProductModal(id) {
            for (var j = 0; j < products.length; j++) {
                if (products[j].id === id) {
                    currentActiveProduct = products[j];
                    break;
                }
            }
            if (!currentActiveProduct) return;
            
            currentModalQty = currentActiveProduct.minQty || 1;
            extraBreadQty = 0;
            extraSamoonQty = 0;
            document.getElementById('extra-bread-qty').innerText = 0;
            document.getElementById('extra-samoon-qty').innerText = 0;
            document.getElementById('item-custom-note').value = '';
            
            var modalContainer = document.getElementById('modal-img-container');
            modalContainer.innerHTML = '<img src="' + (currentActiveProduct.image || 'gallery-1.jpg') + '" alt="" class="w-full h-full object-cover" onerror="this.style.display=\'none\';">' +
                                       '<span class="absolute text-amber-400 text-xs font-bold">🍲 طبق بيتي طازج</span>';
            
            document.getElementById('modal-title').innerText = currentActiveProduct.name;
            
            var modalNote = document.getElementById('modal-note');
            if (currentActiveProduct.note) {
                modalNote.innerText = "📌 " + currentActiveProduct.note;
                modalNote.classList.remove('hidden');
            } else {
                modalNote.classList.add('hidden');
            }

            var extraSection = document.getElementById('extra-bread-section');
            if (currentActiveProduct.category === 'main' || currentActiveProduct.category === 'grills') {
                extraSection.classList.remove('hidden');
            } else {
                extraSection.classList.add('hidden');
            }

            updateModalPriceUI();
            document.getElementById('product-modal').classList.remove('hidden');
        }

        function closeProductModal() {
            document.getElementById('product-modal').classList.add('hidden');
        }

        function changeModalQty(dir) {
            var step = currentActiveProduct.stepQty || 1;
            var min = currentActiveProduct.minQty || 1;

            currentModalQty += (dir * step);
            if (currentModalQty < min) currentModalQty = min;

            updateModalPriceUI();
        }

        function changeExtra(type, dir) {
            if (type === 'extraBread') {
                extraBreadQty += dir;
                if (extraBreadQty < 0) extraBreadQty = 0;
                document.getElementById('extra-bread-qty').innerText = extraBreadQty;
            } else if (type === 'extraSamoon') {
                extraSamoonQty += dir;
                if (extraSamoonQty < 0) extraSamoonQty = 0;
                document.getElementById('extra-samoon-qty').innerText = extraSamoonQty;
            }
            updateModalPriceUI();
        }

        function updateModalPriceUI() {
            if (!currentActiveProduct) return;
            
            var basePrice = 0;
            var dynInfo = document.getElementById('dynamic-serving-info');

            if (currentActiveProduct.isPoundBased) {
                if (currentModalQty === 3) {
                    basePrice = 70;
                } else if (currentModalQty === 4) {
                    basePrice = 93;
                } else if (currentModalQty === 5) {
                    basePrice = 116;
                } else {
                    basePrice = 70 + ((currentModalQty - 3) * 23.33);
                }

                var extraPounds = currentModalQty - 3;
                var calcMin = 3 + (extraPounds * 2);
                var calcMax = 5 + (extraPounds * 2);
                var calcBread = 5 + (extraPounds * 2);

                var servingText = "👥 تكفي تقريباً (" + calcMin + " إلى " + calcMax + " شخصاً) • معها (" + calcBread + " رغيف خبز)";

                if (dynInfo) {
                    dynInfo.innerText = servingText;
                    dynInfo.classList.remove('hidden');
                }
            } else if (currentActiveProduct.isPachaBased) {
                // الباجة: الوجبة الأولى بـ 70$، وكل وجبة إضافية بـ 30$ وبدون حد أقصى
                if (currentModalQty === 1) {
                    basePrice = 70;
                } else {
                    basePrice = 70 + ((currentModalQty - 1) * 30);
                }

                var calcPeople = currentModalQty * 2; // تكفي شخصين لكل وجبة
                var calcBread = 3 + ((currentModalQty - 1) * 2); // 3 أرغفة للوجبة الأولى وكل وجبة إضافية تزود رغيفين

                var pachaText = "👥 تكفي تقريباً (" + calcPeople + " أشخاص) • معها (" + calcBread + " رغيف خبز)";
                if (dynInfo) {
                    dynInfo.innerText = pachaText;
                    dynInfo.classList.remove('hidden');
                }
            } else {
                var unitPrice = currentActiveProduct.unitPrice || currentActiveProduct.price;
                basePrice = unitPrice * currentModalQty;
                if (dynInfo) dynInfo.classList.add('hidden');
            }

            var extrasTotal = (extraBreadQty * 1) + (extraSamoonQty * 1);
            var totalPrice = basePrice + extrasTotal;

            document.getElementById('modal-qty').innerText = currentModalQty + (currentActiveProduct.unitLabel ? ' ' + currentActiveProduct.unitLabel : '');
            document.getElementById('modal-price').innerText = '$' + totalPrice.toFixed(2);
            currentActiveProduct.calculatedPrice = totalPrice;
        }

        function confirmAddToCart() {
            if (!currentActiveProduct) return;
            
            var customNote = document.getElementById('item-custom-note').value.trim();
            var extrasDesc = [];
            if (extraBreadQty > 0) extrasDesc.push(extraBreadQty + " رغيف خبز إضافي");
            if (extraSamoonQty > 0) extrasDesc.push(extraSamoonQty + " صمون إضافي");
            
            if (extrasDesc.length > 0) {
                var extrasString = "إضافات: " + extrasDesc.join('، ');
                customNote = customNote ? customNote + " | " + extrasString : extrasString;
            }

            var finalItemPrice = currentActiveProduct.calculatedPrice;

            cart.push({
                id: currentActiveProduct.id,
                name: currentActiveProduct.name,
                price: finalItemPrice,
                image: currentActiveProduct.image || '',
                quantity: currentModalQty,
                unitLabel: currentActiveProduct.unitLabel || '',
                customNote: customNote,
                isPoundBased: currentActiveProduct.isPoundBased || false,
                isPachaBased: currentActiveProduct.isPachaBased || false
            });

            closeProductModal();
            updateCartUI();
        }

        function updateQuantity(index, dir) {
            var item = cart[index];
            if (dir > 0) {
                item.quantity += 1;
            } else {
                item.quantity -= 1;
                var minLimit = item.isPoundBased ? 3 : (item.isPachaBased ? 1 : 1);
                if (item.quantity < minLimit) {
                    cart.splice(index, 1);
                }
            }
            updateCartUI();
        }

        function removeItemFromCart(index) {
            cart.splice(index, 1);
            updateCartUI();
        }

        function updateCartUI() {
            var badge = document.getElementById('cart-badge');
            var totalItemsCount = cart.length;
            if (totalItemsCount > 0) {
                badge.innerText = totalItemsCount;
                badge.classList.remove('hidden');
            } else {
                badge.classList.add('hidden');
            }

            var container = document.getElementById('cart-items');
            if (cart.length === 0) {
                container.innerHTML = '<p class="text-gray-400 text-center text-xs py-16">صينية الطلبات فارغة حالياً</p>';
                document.getElementById('cart-footer').style.display = 'none';
                return;
            }
            document.getElementById('cart-footer').style.display = 'block';

            var subtotal = 0;
            var html = '';
            for (var j = 0; j < cart.length; j++) {
                var item = cart[j];
                var itemTotalPrice = item.price;

                subtotal += itemTotalPrice;
                var itemImg = '<img src="' + (item.image || '') + '" alt="' + item.name + '" class="w-16 h-16 rounded-lg object-cover border border-amber-500/50" onerror="this.style.display=\'none\';">' +
                              '<div class="w-16 h-16 rounded-lg bg-gray-900 border border-gray-700 flex items-center justify-center text-[9px] text-amber-400 text-center">طبق</div>';

                var noteHtml = item.customNote ? '<p class="text-[11px] text-amber-300 mt-0.5">ملاحظة: ' + item.customNote + '</p>' : '';

                var cartServingDesc = "";
                if (item.isPoundBased) {
                    var extraPounds = item.quantity - 3;
                    var calcMin = 3 + (extraPounds * 2);
                    var calcMax = 5 + (extraPounds * 2);
                    var calcBread = 5 + (extraPounds * 2);
                    cartServingDesc = " (تكفي " + calcMin + "-" + calcMax + " أشخاص • " + calcBread + " رغيف خبز)";
                } else if (item.isPachaBased) {
                    var calcPeople = item.quantity * 2;
                    var calcBread = 3 + ((item.quantity - 1) * 2);
                    cartServingDesc = " (تكفي " + calcPeople + " أشخاص • " + calcBread + " رغيف خبز)";
                }

                html += '<div class="flex items-center justify-between bg-gray-800 p-3 rounded-xl border border-gray-700 gap-3">' +
                    '<div class="flex items-center gap-3 flex-1 relative overflow-hidden">' +
                        itemImg +
                        '<div>' +
                            '<h4 class="font-bold text-sm text-white">' + item.name + '</h4>' +
                            noteHtml +
                            '<p class="text-xs text-amber-400 font-bold mt-1">$' + itemTotalPrice.toFixed(2) + ' <span class="text-[10px] text-gray-400">(' + item.quantity + ' ' + (item.unitLabel || '') + cartServingDesc + ')</span></p>' +
                        '</div>' +
                    '</div>' +
                    '<div class="flex items-center gap-3">' +
                        '<button onclick="removeItemFromCart(' + j + ')" class="w-8 h-8 bg-red-600/20 hover:bg-red-600 text-red-400 hover:text-white rounded-lg flex items-center justify-center text-xs font-bold transition-all border border-red-500/30 shadow" title="حذف الطبق">' +
                            '<i class="fa-solid fa-xmark"></i>' +
                        '</button>' +
                    '</div>' +
                '</div>';
            }

            html += '<div class="bg-gray-950 p-3 rounded-xl text-xs space-y-1.5 mt-3 border border-gray-800">' +
                '<div class="flex justify-between font-extrabold text-sm text-amber-400 pt-1"><span>المجموع الكلي:</span><span>$' + subtotal.toFixed(2) + '</span></div>' +
            '</div>';

            container.innerHTML = html;
        }

        function openCart() {
            document.getElementById('cart-modal').classList.remove('hidden');
            updateCartUI();
        }

        function closeCart() {
            document.getElementById('cart-modal').classList.add('hidden');
        }

        function sendWhatsAppOrder() {
            var name = document.getElementById('customer-name').value.trim();
            if (!name) {
                alert('يرجى كتابة الاسم الكريم قبل إرسال الطلب.');
                return;
            }
            var subtotal = 0;
            
            var msg = "مرحباً، أود تقديم طلب جديد:\n\n";
            msg += "👤 الاسم: " + name + "\n\n";

            msg += "📋 تفاصيل الأطباق:\n";
            for (var j = 0; j < cart.length; j++) {
                subtotal += cart[j].price;

                var servingDesc = "";
                if (cart[j].isPoundBased) {
                    var extraPounds = cart[j].quantity - 3;
                    var calcMin = 3 + (extraPounds * 2);
                    var calcMax = 5 + (extraPounds * 2);
                    var calcBread = 5 + (extraPounds * 2);
                    servingDesc = " [تكفي " + calcMin + "-" + calcMax + " أشخاص • " + calcBread + " رغيف خبز]";
                } else if (cart[j].isPachaBased) {
                    var calcPeople = cart[j].quantity * 2;
                    var calcBread = 3 + ((cart[j].quantity - 1) * 2);
                    servingDesc = " [تكفي " + calcPeople + " أشخاص • " + calcBread + " رغيف خبز]";
                }

                msg += "- " + cart[j].name + " (الكمية: " + cart[j].quantity + " " + (cart[j].unitLabel || '') + ")" + servingDesc;
                if (cart[j].customNote) {
                    msg += " [ملاحظة: " + cart[j].customNote + "]";
                }
                msg += " - $" + cart[j].price.toFixed(2) + "\n";
            }

            msg += "\n💵 المجموع الكلي: $" + subtotal.toFixed(2) + "\n";

            var phone = "3366867948"; 
            var url = "https://wa.me/" + phone + "?text=" + encodeURIComponent(msg);
            window.open(url, '_blank');
        }

        window.onload = function() {
            renderProducts();
        };
    </script>
</body>
</html>
