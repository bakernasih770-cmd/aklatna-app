            { id: 18, name: "بورڭ اللحم (Meat Borek)", category: "appetizers", price: 2.5, description: "بورڭ مقرمش محشو باللحم.", image: "https://images.unsplash.com/photo-1577968897966-3d4325b36b61?auto=format&fit=crop&w=800&q=80" },
            { id: 19, name: "بورڭ الجبن (Cheese Borek)", category: "appetizers", price: 2.5, description: "بورڭ محشو بالجبنة اللذيذة.", image: "https://images.unsplash.com/photo-1577968897966-3d4325b36b61?auto=format&fit=crop&w=800&q=80" },
            { id: 20, name: "لحم بعجين (Lahm bi Ajin)", category: "appetizers", price: 4, description: "قرص لحم بعجين عراقي طازج.", image: "https://images.unsplash.com/photo-1577968897966-3d4325b36b61?auto=format&fit=crop&w=800&q=80" },
            { id: 21, name: "فطائر الجبن بالنعناع", category: "appetizers", price: 3, description: "فطائر مشوية بالجبن والنعناع.", image: "https://images.unsplash.com/photo-1577968897966-3d4325b36b61?auto=format&fit=crop&w=800&q=80" },
            { id: 22, name: "فطائر الزعتر (Zaatar Pastry)", category: "appetizers", price: 2.5, description: "فطائر زعتر طازجة.", image: "https://images.unsplash.com/photo-1577968897966-3d4325b36b61?auto=format&fit=crop&w=800&q=80" },
            { id: 23, name: "فطائر صدر الدجاج", category: "appetizers", price: 3.5, description: "فطائر محشوة بقطع صدر الدجاج المتبل.", image: "https://images.unsplash.com/photo-1577968897966-3d4325b36b61?auto=format&fit=crop&w=800&q=80" },
            { id: 24, name: "فليفلة (Fleifla)", category: "appetizers", price: 2, description: "مقبلات فليفلة شهية.", image: "https://images.unsplash.com/photo-1577968897966-3d4325b36b61?auto=format&fit=crop&w=800&q=80" },

            // المخبوزات والخبز
            { id: 25, name: "صمون عراقي (Iraqi Samoon)", category: "bakery", price: 1, description: "صمون عراقي حجري طازج.", image: "https://images.unsplash.com/photo-1509440159596-0249088772ff?auto=format&fit=crop&w=800&q=80" },
            { id: 26, name: "خبز عراقي (Iraqi Tannour Bread)", category: "bakery", price: 1.5, description: "خبز تنور عراقي حار وطازج.", image: "https://images.unsplash.com/photo-1509440159596-0249088772ff?auto=format&fit=crop&w=800&q=80" },
            { id: 27, name: "خبز عروك (Khubz Urouq)", category: "bakery", price: 3, description: "خبز عروك عراقي باللحم الخالص والخبز المتبل.", image: "https://images.unsplash.com/photo-1509440159596-0249088772ff?auto=format&fit=crop&w=800&q=80" },
            { id: 28, name: "خبز بربري (Barbari Bread)", category: "bakery", price: 2, description: "خبز بربري طازج ومحمص.", image: "https://images.unsplash.com/photo-1509440159596-0249088772ff?auto=format&fit=crop&w=800&q=80" },
            { id: 29, name: "لفة خميرة (Khamira Roll)", category: "bakery", price: 2, description: "لفة خميرة طرية وهشة.", image: "https://images.unsplash.com/photo-1509440159596-0249088772ff?auto=format&fit=crop&w=800&q=80" },
            { id: 30, name: "كعك السمسم (Sesame Kaak)", category: "bakery", price: 5, description: "كعك مقرمش بالسمسم.", image: "https://images.unsplash.com/photo-1587314168485-3236d6710814?auto=format&fit=crop&w=800&q=80" },
            { id: 31, name: "الكليچة العراقية (Kleicha)", category: "bakery", price: 12, description: "كليچة عراقية بالتمر والجوز والبهارات العطرية.", image: "https://images.unsplash.com/photo-1587314168485-3236d6710814?auto=format&fit=crop&w=800&q=80" },

            // السندويتشات
            { id: 32, name: "ساندويچ فلافل (Falafel Sandwich)", category: "sandwiches", price: 8, description: "ساندويچ فلافل بالصمون العراقي مع الطحينة والعمبة.", image: "https://images.unsplash.com/photo-1561758033-d89a9ad46330?auto=format&fit=crop&w=800&q=80" },
            { id: 33, name: "ساندويچ تكة دجاج (Chicken Tikka Sandwich)", category: "sandwiches", price: 12, description: "ساندويچ تكة دجاج مشوية مع السلطة والصلصة.", image: "https://images.unsplash.com/photo-1561758033-d89a9ad46330?auto=format&fit=crop&w=800&q=80" },
            { id: 34, name: "ساندويچ تكة لحم (Meat Tikka Sandwich)", category: "sandwiches", price: 14, description: "ساندويچ تكة لحم بقري مشوية بالصمون العراقي.", image: "https://images.unsplash.com/photo-1561758033-d89a9ad46330?auto=format&fit=crop&w=800&q=80" },
            { id: 35, name: "ساندويچ كباب شوي (Grilled Kebab Sandwich)", category: "sandwiches", price: 11, description: "ساندويچ كباب مشوي على الفحم مع الخضار المشوية.", image: "https://images.unsplash.com/photo-1561758033-d89a9ad46330?auto=format&fit=crop&w=800&q=80" }
        ];

        const AVAILABLE_FONTS = [
            { id: "Cairo", name: "القاهرة (Cairo)" },
            { id: "Tajawal", name: "تجوال (Tajawal)" },
            { id: "Almarai", name: "المراعي (Almarai)" },
            { id: "Readex Pro", name: "ريدكس برو (Readex Pro)" },
            { id: "Changa", name: "تشانغا (Changa)" }
        ];

        function App() {
            const [products, setProducts] = useState(() => {
                const saved = localStorage.getItem('aklatna_products_v2');
                return saved ? JSON.parse(saved) : INITIAL_PRODUCTS;
            });
            const [categories, setCategories] = useState(INITIAL_CATEGORIES);
            const [activeCategory, setActiveCategory] = useState("all");
            const [searchQuery, setSearchQuery] = useState("");
            const [cart, setCart] = useState([]);
            const [isCartOpen, setIsCartOpen] = useState(false);
            const [isAdminOpen, setIsAdminOpen] = useState(false);
            const [selectedFont, setSelectedFont] = useState("Cairo");
            const [deliveryType, setDeliveryType] = useState("pickup");
            const [deliveryDistance, setDeliveryDistance] = useState(3);
            const [deliveryAddress, setDeliveryAddress] = useState("");
            const [customerName, setCustomerName] = useState("");

            const [editingProduct, setEditingProduct] = useState(null);
            const [newProdName, setNewProdName] = useState("");
            const [newProdCategory, setNewProdCategory] = useState("main");
            const [newProdDesc, setNewProdDesc] = useState("");
            const [newProdPrice, setNewProdPrice] = useState("");
            const [newProdImage, setNewProdImage] = useState("");

            useEffect(() => {
                localStorage.setItem('aklatna_products_v2', JSON.stringify(products));
            }, [products]);

            useEffect(() => {
                document.body.style.fontFamily = `'${selectedFont}', sans-serif`;
            }, [selectedFont]);

            const deliveryFee = useMemo(() => {
                return deliveryType === "delivery" ? Math.max(2, deliveryDistance * 1.5) : 0;
            }, [deliveryType, deliveryDistance]);

            const filteredProducts = useMemo(() => {
                return products.filter(product => {
                    const matchesCategory = activeCategory === "all" || product.category === activeCategory;
                    const matchesSearch = product.name.toLowerCase().includes(searchQuery.toLowerCase()) || 
                                          product.description.toLowerCase().includes(searchQuery.toLowerCase());
                    return matchesCategory && matchesSearch;
                });
            }, [products, activeCategory, searchQuery]);

            const addToCart = (product) => {
                const cartItemId = `${product.id}`;
                setCart(prev => {
                    const existing = prev.find(item => item.cartItemId === cartItemId);
                    if (existing) {
                        return prev.map(item =>
                            item.cartItemId === cartItemId ? { ...item, quantity: item.quantity + 1 } : item
                        );
                    }
                    return [...prev, { cartItemId, id: product.id, name: product.name, price: product.price, image: product.image, quantity: 1 }];
                });
                setIsCartOpen(true);
            };

            const updateCartQuantity = (cartItemId, delta) => {
                setCart(prev => prev.map(item => {
                    if (item.cartItemId === cartItemId) {
                        const newQty = item.quantity + delta;
                        return newQty > 0 ? { ...item, quantity: newQty } : null;
                    }
                    return item;
                }).filter(Boolean));
            };

            const cartSubtotal = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            const cartTotal = cartSubtotal + (cart.length > 0 ? deliveryFee : 0);

            const sendWhatsAppOrder = () => {
                if (cart.length === 0) return;
                if (!customerName) {
                    alert("يرجى إدخال اسمك لتأكيد الطلب.");
                    return;
                }

                let message = `🍽️ *طلب جديد من تطبيق أكلاتنا (طبخ بيتي عراقي)* 🍽️\n`;
                message += `👤 *العميل:* ${customerName}\n`;
                message += `📍 *نوع الطلب:* ${deliveryType === "delivery" ? "توصيل للمنزل" : "استلام"}\n`;
                if (deliveryType === "delivery") {
                    message += `🏠 *العنوان:* ${deliveryAddress}\n`;
                    message += `🚗 *المسافة التقديرية:* ${deliveryDistance} ميل\n`;
                }
                message += `--------------------------------\n`;
                message += `🛒 *الأطباق المطلوبة:*\n`;

                cart.forEach((item, index) => {
                    message += `${index + 1}. ${item.name} x${item.quantity} = $${(item.price * item.quantity).toFixed(2)}\n`;
                });

                message += `--------------------------------\n`;
                message += `💰 *المجموع الفرعي:* $${cartSubtotal.toFixed(2)}\n`;
                if (deliveryType === "delivery") {
                    message += `🚚 *أجور التوصيل:* $${deliveryFee.toFixed(2)}\n`;
                }
                message += `✅ *الإجمالي الكلي:* $${cartTotal.toFixed(2)}\n`;

                const url = `https://wa.me/${WHATSAPP_NUMBER.replace('+', '')}?text=${encodeURIComponent(message)}`;
                window.open(url, '_blank');
            };

            const handleSaveProduct = (e) => {
                e.preventDefault();
                if (!newProdName || !newProdPrice) return;

                if (editingProduct) {
                    setProducts(prev => prev.map(p => p.id === editingProduct.id ? {
                        ...p,
                        name: newProdName,
                        category: newProdCategory,
                        description: newProdDesc,
                        price: parseFloat(newProdPrice),
                        image: newProdImage || "https://images.unsplash.com/photo-1546069901-ba9599a7e63c?auto=format&fit=crop&w=800&q=80"
                    } : p));
                } else {
                    const newProd = {
                        id: Date.now(),
                        name: newProdName,
                        category: newProdCategory,
                        description: newProdDesc,
                        price: parseFloat(newProdPrice),
                        image: newProdImage || "https://images.unsplash.com/photo-1546069901-ba9599a7e63c?auto=format&fit=crop&w=800&q=80"
                    };
                    setProducts(prev => [newProd, ...prev]);
                }
                resetForm();
            };

            const resetForm = () => {
                setEditingProduct(null);
                setNewProdName("");
                setNewProdDesc("");
                setNewProdPrice("");
                setNewProdImage("");
            };

            const startEdit = (product) => {
                setEditingProduct(product);
                setNewProdName(product.name);
                setNewProdCategory(product.category);
                setNewProdDesc(product.description);
                setNewProdPrice(product.price);
                setNewProdImage(product.image);
            };

            const deleteProduct = (id) => {
                if (confirm("هل أنت تأكد من حذف هذا الطبق؟")) {
                    setProducts(prev => prev.filter(p => p.id !== id));
                }
            };

            return (
                <div className="min-h-screen flex flex-col pb-10">
                    <header className="bg-gray-900 border-b border-gray-800 sticky top-0 z-30 shadow-xl backdrop-blur-md bg-opacity-90">
                        <div className="max-w-7xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-4">
                            <div className="flex items-center space-x-3 space-x-reverse">
                                <div className="w-10 h-10 rounded-full bg-gradient-to-tr from-amber-500 to-red-600 flex items-center justify-center text-white text-xl font-bold shadow-lg shadow-amber-500/20">
                                    <i className="fa-solid fa-utensils"></i>
                                </div>
                                <div>
                                    <h1 className="text-2xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-amber-400 to-amber-200">أكلاتنا</h1>
                                    <p className="text-xs text-gray-400">Aklatna App - طبخ بيتي عراقي في Greensboro, NC</p>
                                </div>
                            </div>

                            <div className="flex items-center space-x-3 space-x-reverse">
                                <div className="flex items-center bg-gray-800 rounded-lg px-2 py-1 border border-gray-700 text-xs">
                                    <i className="fa-solid fa-font text-amber-400 ml-2"></i>
                                    <select 
                                        value={selectedFont} 
                                        onChange={(e) => setSelectedFont(e.target.value)}
                                        className="bg-transparent text-gray-200 focus:outline-none cursor-pointer"
                                    >
                                        {AVAILABLE_FONTS.map(font => (
                                            <option key={font.id} value={font.id} className="bg-gray-900 text-gray-200">{font.name}</option>
                                        ))}
                                    </select>
                                </div>

                                <button 
                                    onClick={() => setIsAdminOpen(true)}
                                    className="bg-gray-800 hover:bg-gray-700 text-amber-400 border border-amber-500/30 px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1.5 transition-all"
                                >
                                    <i className="fa-solid fa-sliders"></i>
                                    <span>لوحة الإدارة</span>
                                </button>

                                <button 
                                    onClick={() => setIsCartOpen(true)}
                                    className="relative bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-600 hover:to-amber-700 text-gray-950 font-bold px-4 py-1.5 rounded-lg text-sm flex items-center gap-2 shadow-lg shadow-amber-500/20 transition-all"
                                >
                                    <i className="fa-solid fa-cart-shopping"></i>
                                    <span>السلة</span>
