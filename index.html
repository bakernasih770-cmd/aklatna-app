<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أكلاتنا - طبخ بيتي عراقي في جرينزبورو</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #0b0f19; color: #f3f4f6; }
        .hero-bg {
            position: absolute;
            inset: 0;
            background-size: cover;
            background-position: center;
            transition: opacity 2.5s ease-in-out, transform 8s ease-out;
            opacity: 0;
            z-index: 1;
            transform: scale(1);
        }
        .hero-bg.active {
            opacity: 1;
            transform: scale(1.05);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col pb-10">

    <header class="bg-gray-900 border-b border-gray-800 sticky top-0 z-30 shadow-xl">
        <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center space-x-3 space-x-reverse">
                <div class="w-12 h-12 rounded-full overflow-hidden flex items-center justify-center shadow-lg bg-emerald-600 border-2 border-emerald-400">
                    <svg viewBox="0 0 100 100" class="w-full h-full p-1">
                        <circle cx="50" cy="50" r="44" fill="none" stroke="#ffffff" stroke-width="3" />
                        <text x="50" y="48" font-family="'Cairo', sans-serif" font-size="22" font-weight="900" fill="#ffffff" text-anchor="middle">حلال</text>
                        <text x="50" y="68" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="1">HALAL</text>
                    </svg>
                </div>
                <div>
                    <p class="text-xs text-gray-400">طبخ بيتي عراقي حلال 100% في Greensboro, NC</p>
                </div>
            </div>
            <div class="flex items-center space-x-3 space-x-reverse">
                <button onclick="openCart()" class="bg-amber-500 hover:bg-amber-600 text-gray-950 font-bold px-4 py-2 rounded-lg text-sm flex items-center gap-2 shadow-lg transition-all relative">
                    <i class="fa-solid fa-utensils"></i>
                    <span>الصينية</span>
                    <span id="cart-badge" class="bg-red-600 text-white text-xs w-5 h-5 rounded-full flex items-center justify-center hidden">0</span>
                </button>
            </div>
        </div>
    </header>

    <section id="hero-section" class="relative py-20 px-4 border-b border-gray-800 text-center overflow-hidden bg-gray-950 min-h-[420px] flex flex-col justify-end">
        <div id="bg-layer-1" class="hero-bg active" style="background-image: url('gallery-1.jpg');"></div>
        <div id="bg-layer-2" class="hero-bg" style="background-image: url('gallery-2.jpg');"></div>

        <div class="relative z-10 max-w-4xl mx-auto pb-6">
            <h2 class="text-6xl md:text-9xl font-black text-amber-400 mb-1 tracking-wider drop-shadow-[0_6px_6px_rgba(0,0,0,0.95)]">أكلاتنا</h2>
            <p class="text-xl md:text-3xl font-extrabold text-white mb-8 drop-shadow-[0_3px_3px_rgba(0,0,0,0.95)]">أطباق عراقية طازجة</p>
            
            <input 
                type="text" 
                id="search-input"
                placeholder="ابحث عن طبقك المفضّل..." 
                oninput="renderProducts()"
                class="w-full max-w-lg bg-gray-950/90 border border-amber-500/60 rounded-xl py-3 px-5 text-white text-sm focus:outline-none focus:border-amber-400 shadow-2xl"
            />
        </div>
    </section>

    <div class="bg-gray-900 border-y border-amber-500/30 py-3 px-4 shadow-inner">
        <div class="max-w-7xl mx-auto flex flex-wrap justify-center items-center gap-6 text-xs md:text-sm font-bold text-amber-300 text-center">
            <div class="flex items-center gap-2">
                <i class="fa-solid fa-circle-check text-green-400"></i>
                <span>جميع اللحوم المستخدمة حلال 100%</span>
            </div>
            <div class="hidden md:inline text-gray-600">|</div>
            <div class="flex items-center gap-2">
                <i class="fa-solid fa-clock text-amber-400"></i>
                <span>يرجى إتمام الطلب قبل 24 ساعة</span>
            </div>
        </div>
    </div>

    <main class="max-w-7xl mx-auto px-4 py-8 flex-grow w-full">
        <div class="flex gap-2 overflow-x-auto pb-4 mb-8 justify-center flex-wrap" id="categories-container">
            <button onclick="filterCategory('all', this)" class="cat-btn px-4 py-2 rounded-xl font-semibold text-xs whitespace-nowrap bg-amber-500 text-gray-950">الكل</button>
            <button onclick="filterCategory('main', this)" class="cat-btn px-4 py-2 rounded-xl font-semibold text-xs whitespace-nowrap bg-gray-800 text-gray-400">الأطباق الرئيسية</button>
            <button onclick="filterCategory('grills', this)" class="cat-btn px-4 py-2 rounded-xl font-semibold text-xs whitespace-nowrap bg-gray-800 text-gray-400">المشويات</button>
            <button onclick="filterCategory('fish', this)" class="cat-btn px-4 py-2 rounded-xl font-semibold text-xs whitespace-nowrap bg-gray-800 text-gray-400">الأسماك</button>
            <button onclick="filterCategory('appetizers', this)" class="cat-btn px-4 py-2 rounded-xl font-semibold text-xs whitespace-nowrap bg-gray-800 text-gray-400">المعجنات والمقبلات</button>
            <button onclick="filterCategory('bakery', this)" class="cat-btn px-4 py-2 rounded-xl font-semibold text-xs whitespace-nowrap bg-gray-800 text-gray-400">المخبوزات والخبز</button>
            <button onclick="filterCategory('sandwiches', this)" class="cat-btn px-4 py-2 rounded-xl font-semibold text-xs whitespace-nowrap bg-gray-800 text-gray-400">السندويتشات</button>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="products-grid"></div>
    </main>

    <!-- Modal عرض المنتج -->
    <div id="product-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/80 hidden p-4">
        <div class="w-full max-w-md bg-gray-900 text-white rounded-2xl overflow-hidden shadow-2xl border border-gray-800 flex flex-col">
            <div class="relative h-64 bg-gray-950 flex items-center justify-center">
                <img id="modal-img" src="" alt="" class="w-full h-full object-cover" onerror="this.onerror=null; this.src='gallery-1.jpg';">
                
                <button onclick="closeProductModal()" class="absolute top-3 right-3 bg-black/80 hover:bg-black text-amber-400 px-3 py-1.5 rounded-xl text-xs font-bold flex items-center gap-1.5 shadow-lg border border-amber-500/30 transition-all z-10">
                    <i class="fa-solid fa-arrow-right"></i>
                    <span>العودة للقائمة</span>
                </button>
                
                <span id="modal-price" class="absolute bottom-3 left-3 bg-amber-500 text-gray-950 px-3 py-1 rounded-full text-sm font-black z-10"></span>
            </div>
            <div class="p-6 space-y-4">
                <h3 id="modal-title" class="text-xl font-extrabold text-amber-400"></h3>
                <p id="modal-note" class="text-xs text-amber-300 font-semibold bg-gray-950 p-2 rounded-lg border border-gray-800 hidden"></p>
                
                <div class="flex items-center justify-between pt-2 border-t border-gray-800">
                    <span class="text-xs text-gray-400 font-bold" id="modal-qty-label">الكمية المطلوبة:</span>
                    <div class="flex items-center gap-3 bg-gray-950 px-3 py-1.5 rounded-xl border border-gray-700">
                        <button onclick="changeModalQty(-1)" class="w-7 h-7 bg-gray-800 hover:bg-gray-700 text-white rounded-lg flex items-center justify-center font-bold text-sm">-</button>
                        <span id="modal-qty" class="text-sm font-extrabold w-28 text-center text-amber-400">1</span>
                        <button onclick="changeModalQty(1)" class="w-7 h-7 bg-gray-800 hover:bg-gray-700 text-white rounded-lg flex items-center justify-center font-bold text-sm">+</button>
                    </div>
                </div>

                <!-- التعديل الخاص بالقوزي: عرض عدد الأشخاص وأرغفة الخبز تصاعدياً -->
                <div id="dynamic-serving-info" class="text-xs text-center font-bold text-emerald-400 bg-emerald-950/40 p-2 rounded-lg border border-emerald-500/30 hidden"></div>

                <div class="space-y-1">
                    <label class="text-xs text-gray-400 font-bold block">ملاحظات على الطبق (اختياري):</label>
                    <input type="text" id="item-custom-note" value="" placeholder="" class="w-full p-2.5 bg-gray-950 border border-gray-700 rounded-xl text-white text-xs focus:border-amber-400 focus:outline-none" />
                </div>

                <button onclick="confirmAddToCart()" class="w-full bg-amber-500 hover:bg-amber-600 text-gray-950 font-extrabold py-3 rounded-xl text-sm shadow-lg flex items-center justify-center gap-2">
                    <i class="fa-solid fa-cart-plus"></i>
                    <span>أضف إلى الصينية</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Modal الصينية -->
    <div id="cart-modal" class="fixed inset-0 z-50 flex justify-end bg-black/80 hidden">
        <div class="w-full max-w-lg bg-gray-900 text-white h-full flex flex-col shadow-2xl overflow-hidden">
            <div class="p-4 bg-gray-950 border-b border-gray-800 flex justify-between items-center">
                <h2 class="font-bold text-amber-400 text-base"><i class="fa-solid fa-utensils ml-2"></i> صينية الطلبات الشاملة</h2>
                
                <button onclick="closeCart()" class="text-amber-400 hover:text-amber-300 text-xs font-bold bg-black/80 border border-amber-500/40 px-3 py-1.5 rounded-xl flex items-center gap-1.5 transition-all shadow">
                    <i class="fa-solid fa-arrow-right"></i>
                    <span>العودة للقائمة</span>
                </button>
            </div>
            
            <div class="flex-1 overflow-y-auto p-4 space-y-4" id="cart-items"></div>

            <div class="p-4 bg-gray-950 border-t border-gray-800 space-y-3" id="cart-footer">
                <input type="text" id="customer-name" placeholder="الاسم الكريم" class="w-full p-2.5 bg-gray-900 border border-gray-700 rounded-lg text-white text-xs focus:border-amber-400 focus:outline-none" />

                <button onclick="sendWhatsAppOrder()" class="w-full bg-green-600 hover:bg-green-700 text-white py-3 rounded-xl font-bold text-sm shadow-lg flex items-center justify-center gap-2">
                    <i class="fa-brands fa-whatsapp text-lg"></i>
                    <span>إرسال الطلب عبر الواتساب</span>
                </button>
            </div>
        </div>
    </div>
