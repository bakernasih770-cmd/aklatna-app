<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أكلاتنا - طبخ بيتي عراقي في جرينزبورو</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Cairo', sans-serif; background-color: #0b0f19; color: #f3f4f6; min-height: 100vh; display: flex; flex-direction: column; padding-bottom: 40px; }
        header { background-color: #111827; border-bottom: 1px solid #1f2937; position: sticky; top: 0; z-index: 30; }
        .header-container { max-width: 1200px; margin: 0 auto; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; }
        .cart-btn { background-color: #f59e0b; color: #030712; font-weight: bold; padding: 8px 16px; border-radius: 8px; border: none; cursor: pointer; display: flex; align-items: center; gap: 8px; position: relative; }
        .cart-badge { position: absolute; top: -5px; right: -5px; background-color: #dc2626; color: white; font-size: 11px; width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        .hidden { display: none !important; }
        .hero { position: relative; padding: 80px 16px; text-align: center; background-color: #030712; min-height: 400px; display: flex; flex-direction: column; justify-content: flex-end; border-bottom: 1px solid #1f2937; }
        .search-input { width: 100%; max-width: 500px; margin: 0 auto; background-color: rgba(3,7,18,0.9); border: 1px solid rgba(245,158,11,0.6); border-radius: 12px; padding: 12px 20px; color: white; font-size: 14px; outline: none; }
        main { max-width: 1200px; margin: 0 auto; padding: 32px 16px; width: 100%; flex-grow: 1; }
        .categories { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 16px; margin-bottom: 32px; justify-content: center; flex-wrap: wrap; }
        .cat-btn { padding: 8px 16px; border-radius: 12px; font-weight: 600; font-size: 12px; cursor: pointer; border: none; background-color: #1f2937; color: #9ca3af; }
        .cat-btn.active { background-color: #fbbf24; color: #030712; font-weight: bold; }
        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; width: 100%; }
        .product-card { background-color: #111827; border: 1px solid #1f2937; border-radius: 16px; overflow: hidden; display: flex; flex-direction: column; cursor: pointer; }
        .product-img-box { position: relative; height: 220px; background-color: #030712; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .product-img { width: 100%; height: 100%; object-fit: cover; }
        .product-price-tag { position: absolute; top: 12px; left: 12px; background-color: rgba(0,0,0,0.8); padding: 4px 10px; border-radius: 9999px; font-size: 12px; font-weight: bold; color: #fbbf24; }
        .product-info { padding: 16px; text-align: center; }
        .product-title { font-weight: 800; font-size: 16px; color: white; margin-bottom: 4px; }
        .product-note { font-size: 11px; color: #fde68a; margin-bottom: 8px; font-weight: bold; }
        .product-action { font-size: 12px; color: #fbbf24; font-weight: bold; }
        
        /* تنسيقات نافذة التفاصيل والدخان الواقعي حول الطبق بالكامل */
        .modal-overlay { position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center; background-color: rgba(0,0,0,0.85); padding: 16px; }
        .modal-content { width: 100%; max-width: 420px; background-color: #111827; color: white; border-radius: 16px; overflow: hidden; border: 1px solid #1f2937; display: flex; flex-direction: column; }
        .steam-container { position: absolute; inset: 0; pointer-events: none; z-index: 20; overflow: hidden; }
        .steam-particle { position: absolute; bottom: 10%; background: radial-gradient(circle, rgba(255,255,255,0.85) 0%, rgba(255,255,255,0.2) 50%, rgba(255,255,255,0) 80%); border-radius: 50%; filter: blur(4px); animation: riseSteamRealistic 3.5s infinite ease-in-out; }
        @keyframes riseSteamRealistic {
            0% { transform: translateY(15px) translateX(0) scale(0.3); opacity: 0; }
            30% { opacity: 0.6; }
            70% { opacity: 0.4; transform: translateY(-80px) translateX(15px) scale(2); }
            100% { transform: translateY(-160px) translateX(-15px) scale(3.5); opacity: 0; }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-container">
            <div style="display: flex; align-items: center; gap: 10px;">
                <div style="width: 42px; height: 42px; border-radius: 50%; background-color: #059669; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; font-size: 12px;">حلال</div>
                <p style="font-size: 11px; color: #9ca3af;">طبخ بيتي عراقي في Greensboro, NC</p>
            </div>
            <button onclick="openCart()" class="cart-btn">
                <i class="fa-solid fa-utensils"></i>
                <span>الصينية</span>
                <span id="cart-badge" class="cart-badge hidden">0</span>
            </button>
        </div>
    </header>

    <section class="hero">
        <div style="position: absolute; inset: 0; background-image: url('gallery-1.jpg'); background-size: cover; background-position: center; opacity: 0.4;"></div>
        <div style="position: relative; z-index: 10; max-width: 800px; margin: 0 auto; padding-bottom: 20px;">
            <h2 style="font-size: 3.5rem; font-weight: 900; color: #fbbf24; margin-bottom: 4px;">أكلاتنا</h2>
            <p style="font-size: 1.2rem; font-weight: 800; color: white; margin-bottom: 20px;">أطباق عراقية طازجة</p>
            <input type="text" id="search-input" placeholder="ابحث عن طبقك المفضّل..." oninput="renderProducts()" class="search-input"/>
        </div>
    </section>

    <main>
        <div class="categories">
            <button onclick="filterCategory('all', this)" class="cat-btn active">الكل</button>
            <button onclick="filterCategory('main', this)" class="cat-btn">الأطباق الرئيسية</button>
            <button onclick="filterCategory('grills', this)" class="cat-btn">المشويات</button>
            <button onclick="filterCategory('fish', this)" class="cat-btn">الأسماك</button>
            <button onclick="filterCategory('appetizers', this)" class="cat-btn">المعجنات والمقبلات</button>
            <button onclick="filterCategory('bakery', this)" class="cat-btn">المخبوزات والخبز</button>
            <button onclick="filterCategory('sandwiches', this)" class="cat-btn">السندويتشات</button>
        </div>

        <div class="products-grid" id="products-grid"></div>
    </main>

    <!-- Modal التفاصيل -->
    <div id="product-modal" class="modal-overlay hidden">
        <div class="modal-content">
            <div style="position: relative; height: 220px; background-color: #030712; display: flex; align-items: center; justify-content: center; overflow: hidden;">
                <div id="modal-img-container" style="width: 100%; height: 100%; position: relative; display: flex; align-items: center; justify-content: center;"></div>
                <button onclick="closeProductModal()" style="position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.8); color: #fbbf24; padding: 6px 12px; border-radius: 8px; font-size: 11px; border: none; cursor: pointer; z-index: 30;">العودة</button>
                <span id="modal-price" style="position: absolute; bottom: 10px; left: 10px; background: #fbbf24; color: #030712; padding: 4px 10px; border-radius: 99px; font-size: 13px; font-weight: bold; z-index: 30;"></span>
            </div>
            <div style="padding: 16px; display: flex; flex-direction: column; gap: 12px;">
                <h3 id="modal-title" style="font-size: 18px; font-weight: bold; color: #fbbf24;"></h3>
                <p id="modal-note" style="font-size: 11px; color: #fde68a; background: #030712; padding: 8px; border-radius: 6px; display: none;"></p>
                
                <div style="display: flex; align-items: center; justify-content: space-between; border-top: 1px solid #1f2937; padding-top: 10px;">
                    <span style="font-size: 11px; color: #9ca3af;">الكمية:</span>
                    <div style="display: flex; align-items: center; gap: 10px;">
                        <button onclick="changeModalQty(-1)" style="width: 26px; height: 26px; background: #1f2937; color: white; border: none; border-radius: 6px; cursor: pointer;">-</button>
                        <span id="modal-qty" style="font-size: 13px; font-weight: bold; color: #fbbf24; width: 80px; text-align: center;">1</span>
                        <button onclick="changeModalQty(1)" style="width: 26px; height: 26px; background: #1f2937; color: white; border: none; border-radius: 6px; cursor: pointer;">+</button>
                    </div>
                </div>

                <button onclick="confirmAddToCart()" style="width: 100%; background: #fbbf24; color: #030712; font-weight: bold; padding: 10px; border-radius: 10px; border: none; cursor: pointer; font-size: 13px;">أضف إلى الصينية</button>
            </div>
        </div>
    </div>

    <!-- Modal الصينية -->
    <div id="cart-modal" class="modal-overlay hidden" style="justify-content: flex-end; padding: 0;">
        <div style="width: 100%; max-width: 420px; background: #111827; height: 100%; display: flex; flex-direction: column;">
            <div style="padding: 16px; background: #030712; display: flex; justify-content: space-between; align-items: center;">
                <h2 style="font-size: 15px; color: #fbbf24; font-weight: bold;">صينية الطلبات</h2>
                <button onclick="closeCart()" style="background: none; border: none; color: #fbbf24; font-size: 14px; cursor: pointer;">إغلاق</button>
            </div>
            <div id="cart-items" style="flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px;"></div>
            <div style="padding: 16px; background: #030712; display: flex; flex-direction: column; gap: 10px;">
                <input type="text" id="customer-name" placeholder="الاسم الكريم" style="width: 100%; padding: 10px; background: #111827; border: 1px solid #374151; border-radius: 8px; color: white; font-size: 12px; outline: none;"/>
                <button onclick="sendWhatsAppOrder()" style="width: 100%; background: #16a34a; color: white; padding: 10px; border-radius: 8px; font-weight: bold; border: none; cursor: pointer; font-size: 13px;">إرسال عبر الواتساب</button>
            </div>
        </div>
    </div>

    <script>
        var products = [
            { id: 1, name: "الدولمة العراقية", category: "main", price: 60, minQty: 1, image: "dolma.jpg", note: "دولمة عراقية أصيلة طازجة" },
            { id: 2, name: "الباچة", category: "main", price: 70, minQty: 1, image: "pacha.jpg", note: "رأس خروف مع 4 أرجل" },
            { id: 3, name: "القوزي العراقي", category: "main", price: 70, minQty: 3, image: "qoozi.jpg", note: "لحم خروف مع اللوز" },
            { id: 4, name: "دجاج مع طبق رز اصفر", category: "main", price: 25, minQty: 1, image: "chicken with rice.png", note: "" },
            { id: 10, name: "كباب شوي", category: "grills", price: 30, minQty: 1, image: "kebab.jpg", note: "10 شيش كباب" },
            { id: 13, name: "السمك المشوي Tilapia", category: "fish", price: 28, minQty: 1, image: "masgouf.jpg", note: "" },
            { id: 15, name: "كبة حلب", category: "appetizers", price: 3, minQty: 1, image: "kibbeh-halab.jpg", note: "" },
            { id: 25, name: "الصمون العراقي", category: "bakery", price: 20, minQty: 2, image: "samoon.jpg", note: "20$ / ربطتين" },
            { id: 32, name: "ساندويچ فلافل", category: "sandwiches", price: 8, minQty: 1, image: "falafel-plate.jpg", note: "" }
        ];

        var cart = [];
        var currentCategory = 'all';
        var currentActiveProduct = null;
        var currentModalQty = 1;

        function renderProducts() {
            var grid = document.getElementById('products-grid');
            if (!grid) return;
            var queryInput = document.getElementById('search-input');
            var query = (queryInput && queryInput.value) ? queryInput.value.toLowerCase().trim() : '';
            var html = '';
            
            for (var i = 0; i < products.length; i++) {
                var p = products[i];
                var matchCat = (currentCategory === 'all' || p.category === currentCategory);
                var matchQuery = (query === '' || p.name.toLowerCase().indexOf(query) !== -1);
                
                if (matchCat && matchQuery) {
                    html += '<div onclick="openProductModal(' + p.id + ')" class="product-card">' +
                        '<div class="product-img-box">' +
                            '<img src="' + p.image + '" alt="' + p.name + '" class="product-img" onerror="this.onerror=null; this.src=\'gallery-1.jpg\';">' +
                            '<span class="product-price-tag">$' + p.price.toFixed(2) + '</span>' +
                        '</div>' +
                        '<div class="product-info">' +
                            '<h3 class="product-title">' + p.name + '</h3>' +
                            (p.note ? '<p class="product-note">' + p.note + '</p>' : '') +
                            '<span class="product-action">اضغط للتفاصيل 🔍</span>' +
                        '</div>' +
                    '</div>';
                }
            }
            grid.innerHTML = html;
        }

        function filterCategory(cat, btn) {
            currentCategory = cat;
            var buttons = document.querySelectorAll('.cat-btn');
            for (var i = 0; i < buttons.length; i++) buttons[i].className = "cat-btn";
            if (btn) btn.className = "cat-btn active";
            renderProducts();
        }

        function openProductModal(id) {
            for (var j = 0; j < products.length; j++) {
                if (products[j].id === id) { currentActiveProduct = products[j]; break; }
            }
            if (!currentActiveProduct) return;
            currentModalQty = currentActiveProduct.minQty || 1;
            
            var modalContainer = document.getElementById('modal-img-container');
            // دخان واقعي وموزع بالكامل حول مساحة طبق الأكل داخل النافذة
            var steamHtml = '<div class="steam-container">' +
                '<div class="steam-particle" style="left: 15%; width: 30px; height: 70px; animation-delay: 0s;"></div>' +
                '<div class="steam-particle" style="left: 40%; width: 40px; height: 90px; animation-delay: 0.6s;"></div>' +
                '<div class="steam-particle" style="left: 70%; width: 35px; height: 80px; animation-delay: 0.3s;"></div>' +
                '<div class="steam-particle" style="left: 85%; width: 28px; height: 65px; animation-delay: 1s;"></div>' +
            '</div>';

            modalContainer.innerHTML = '<img src="' + currentActiveProduct.image + '" style="width:100%; height:100%; object-fit:cover;" onerror="this.src=\'gallery-1.jpg\'">' + steamHtml;
            document.getElementById('modal-title').innerText = currentActiveProduct.name;
            document.getElementById('modal-price').innerText = '$' + (currentActiveProduct.price * currentModalQty).toFixed(2);
            document.getElementById('modal-qty').innerText = currentModalQty;
            
            var noteEl = document.getElementById('modal-note');
            if(currentActiveProduct.note) { noteEl.innerText = currentActiveProduct.note; noteEl.style.display = 'block'; } else { noteEl.style.display = 'none'; }
            
            document.getElementById('product-modal').classList.remove('hidden');
        }

        function closeProductModal() { document.getElementById('product-modal').classList.add('hidden'); }
        function changeModalQty(dir) {
            currentModalQty += dir;
            if (currentModalQty < (currentActiveProduct.minQty || 1)) currentModalQty = currentActiveProduct.minQty || 1;
            document.getElementById('modal-qty').innerText = currentModalQty;
            document.getElementById('modal-price').innerText = '$' + (currentActiveProduct.price * currentModalQty).toFixed(2);
        }

        function confirmAddToCart() {
            cart.push({ name: currentActiveProduct.name, price: currentActiveProduct.price * currentModalQty, qty: currentModalQty, image: currentActiveProduct.image });
            closeProductModal();
            updateCartUI();
        }

        function updateCartUI() {
            var badge = document.getElementById('cart-badge');
            if (cart.length > 0) { badge.innerText = cart.length; badge.classList.remove('hidden'); } else { badge.classList.add('hidden'); }
            var container = document.getElementById('cart-items');
            var html = '';
            var total = 0;
            for (var i = 0; i < cart.length; i++) {
                total += cart[i].price;
                html += '<div style="background:#1f2937; padding:10px; border-radius:8px; display:flex; justify-content:space-between; align-items:center;">' +
                    '<span style="color:white; font-size:12px;">' + cart[i].name + ' (' + cart[i].qty + ')</span>' +
                    '<span style="color:#fbbf24; font-size:12px; font-weight:bold;">$' + cart[i].price.toFixed(2) + '</span>' +
                '</div>';
            }
            container.innerHTML = html || '<p style="color:#9ca3af; text-align:center; font-size:12px;">الصينية فارغة</p>';
        }

        function openCart() { document.getElementById('cart-modal').classList.remove('hidden'); updateCartUI(); }
        function closeCart() { document.getElementById('cart-modal').classList.add('hidden'); }

        function sendWhatsAppOrder() {
            var name = document.getElementById('customer-name').value.trim();
            if (!name) { alert('يرجى كتابة الاسم'); return; }
            var msg = "طلب جديد من: " + name + "\n\n";
            var total = 0;
            for (var i = 0; i < cart.length; i++) {
                total += cart[i].price;
                msg += "- " + cart[i].name + " (العدد: " + cart[i].qty + ") - $" + cart[i].price.toFixed(2) + "\n";
            }
            msg += "\nالمجموع: $" + total.toFixed(2);
            window.open("https://wa.me/3366867948?text=" + encodeURIComponent(msg), '_blank');
        }

        window.onload = renderProducts;
        renderProducts();
    </script>
</body>
</html>
