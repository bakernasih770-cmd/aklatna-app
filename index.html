// L = 'ar' أو 'en'
function calcItem(p, qty, size, L) {
  var unit = (L === 'en') ? (p.unitEn || 'piece') : (p.unitLabel || 'قطعة');
  var r = { price: 0, label: qty + ' ' + unit, info: '' };
  if (p.isDolmaBased) {
    var d = dolmaData[size];
    r.price = d.price; r.label = d.label[L]; r.info = d.text[L];
    return r;
  }
  for (var key in tiers) {
    if (p[key]) {
      var t = tiers[key];
      r.price = qty <= t[1] ? t[0] : t[0] + (qty - t[1]) * t[2];
      if (p.isFries) r.label = (L === 'en') ? qty + ' × half lb (' + (qty / 2) + ' lb)' : qty + ' × نصف باوند (' + (qty / 2) + ' باوند)';
      if (p.isMeatTikkaBased || p.isChickenTikkaBased) r.info = tikkaInfo[L];
      return r;
    }
  }
  if (p.id === 31) { r.price = qty * 25; r.label = qty + (L === 'en' ? ' lb' : ' باوند'); return r; }
  if (p.isPoundBased) {
    r.price = qty === 3 ? 70 : qty === 4 ? 93 : qty === 5 ? 116 : 70 + (qty - 3) * 23;
    return r;
  }
  if (p.isPachaBased) {
    r.price = qty * 50;
    r.label = (L === 'en')
      ? qty + (qty > 1 ? ' pacha heads with ' : ' pacha head with ') + (qty * 4) + ' trotters'
      : qty + ' رأس باچة مع ' + (qty * 4) + (qty * 4 > 10 ? ' رجل' : ' أرجل') + ' (كراع)';
    return r;
  }
  r.price = qty * (p.unitPrice ? p.unitPrice : p.price);
  return r;
}

    html += '<div class="bg-gray-900 border border-gray-800 rounded-2xl overflow-hidden shadow-lg flex flex-col">' +
      '<div class="relative h-48 bg-gray-950 flex items-center justify-center">' + imgTag(it.image, nm) +
      '<span class="absolute top-3 left-3 bg-black/75 px-3 py-1 rounded-full text-xs font-bold text-amber-400 z-10">$' + fmtPrice(it.price) + ' / ' + (it.unit ? ((lang === 'en') ? it.unit.en : it.unit.ar) : unitOne) + '</span></div>' +
      '<div class="p-4 text-center space-y-3"><h3 class="font-extrabold text-base text-white">' + nm + '</h3>' +
      '<div class="flex items-center justify-center gap-3 bg-gray-950 px-3 py-1.5 rounded-xl border border-gray-700 w-fit mx-auto">' +
      '<button onclick="changeTray(\'' + it.key + '\', -1)" class="' + btnCls + '">-</button>' +
      '<span id="tray-qty-' + it.key + '" class="text-sm font-extrabold w-10 text-center text-amber-400">' + trayQty[currentTray][it.key] + '</span>' +
      '<button onclick="changeTray(\'' + it.key + '\', 1)" class="' + btnCls + '">+</button></div></div></div>';
  }

  html += '</div><div class="max-w-md mx-auto space-y-3">';
  if (tray.extras) html += trayExtraRow('extraBreadLabel', 'bread') + trayExtraRow('extraSamoonLabel', 'samoon');
  html += '<textarea id="tray-note" rows="2" oninput="trayNotes[currentTray]=this.value" placeholder="' + tr('itemNotePh') + '" class="w-full p-3 bg-gray-900 border border-amber-500/50 rounded-xl text-white text-xs font-medium focus:border-amber-400 focus:outline-none shadow-inner resize-none"></textarea>' +
    '<div class="flex items-center justify-between bg-amber-500/10 p-3 rounded-xl border border-amber-500/30">' +
    '<span class="text-xs text-amber-300 font-bold">' + tr('buildTotal') + '</span><span id="tray-total" class="text-xl font-black text-amber-400"></span></div>' +
    '<button onclick="addTrayToCart()" class="w-full bg-amber-500 hover:bg-amber-600 text-gray-950 font-extrabold py-3 rounded-xl text-sm shadow-lg flex items-center justify-center gap-2">' +
    '<i class="fa-solid fa-cart-plus"></i><span>' + tr('addToTray') + '</span></button>' +
    '<p id="tray-msg" class="text-center text-xs font-bold text-emerald-400 h-4"></p></div></div>';

  grid.innerHTML = html;
  byId('tray-note').value = trayNotes[currentTray] || '';
  updateTrayTotal();
}

function addTrayToCart() {
  var k = currentTray, tray = trays[k], t = trayTotals(k);
  if (t.count === 0) { alert(tr('buildEmpty')); return; }
  if (t.sum < tray.minPrice) { alert(minAlertText(k)); return; }
  var tq = {};
  for (var key in trayQty[k]) tq[key] = trayQty[k][key];
  var item = {
    product: { id: 'tray-' + k, name: tray.cart.ar, nameEn: tray.cart.en },
    trayKey: k,
    trayQty: tq,
    size: '',
    extraBread: tray.extras ? trayExtras[k].bread : 0,
    extraSamoon: tray.extras ? trayExtras[k].samoon : 0,
    customNote: (byId('tray-note').value || '').trim()
  };
  recalcItem(item);
  cart.push(item);
  saveCart();
  updateCartBadge();
  resetTray(k);
  renderTrays();
  var msg = byId('tray-msg');
  if (msg) {
    msg.innerText = tr('buildAdded');
    clearTimeout(trayMsgTimer);
    trayMsgTimer = setTimeout(function () { var m = byId('tray-msg'); if (m) m.innerText = ''; }, 2500);
  }
}

/* ---------- عرض المنتجات ---------- */
function startPrice(p) {
  if (p.isDolmaBased) return tr('from') + ' $' + dolmaData.small.price;
  for (var key in tiers) if (p[key]) return tr('from') + ' $' + tiers[key][0];
  return p.price ? '$' + p.price.toFixed(2) : '';
}

/* ملاحظة "الطلب بالمفرد" في تبويبات المشاويات والنواشف والمعجنات */
var singleTrayFor = { grills: 'grills', appetizers: 'nawashef', pastries: 'pastries' };

function singleMealsNote(key) {
  if (!(MIN_PICKUP_ORDER > 0) && !(MIN_DELIVERY_ORDER > 0)) return '';
  return '<div class="col-span-full bg-amber-500/10 border border-amber-500/30 rounded-xl p-3 text-center">' +
    '<p class="text-xs md:text-sm text-amber-300 font-bold">' + tr(key).replace('{pick}', MIN_PICKUP_ORDER).replace('{del}', MIN_DELIVERY_ORDER).replace('{free}', FREE_DELIVERY_MIN) + '</p></div>';
}

function sandwichTable() {
  var cols = [];
  if (MIN_PICKUP_ORDER > 0) cols.push({ head: tr('sandColPick').replace('{n}', MIN_PICKUP_ORDER), need: MIN_PICKUP_ORDER });
  if (MIN_DELIVERY_ORDER > 0) cols.push({ head: tr('sandColDel').replace('{n}', MIN_DELIVERY_ORDER), need: MIN_DELIVERY_ORDER });
  cols.push({ head: tr('sandColFree').replace('{n}', FREE_DELIVERY_MIN), need: FREE_DELIVERY_MIN });
  var th = 'px-1.5 py-1.5 font-bold text-amber-300', html = '<div class="col-span-full bg-amber-500/10 border border-amber-500/30 rounded-xl p-3">' +
    '<p class="text-xs md:text-sm text-amber-300 font-bold text-center mb-2">' + tr('sandTitle') + '</p>' +
    '<div class="overflow-x-auto"><table class="w-full text-center text-[11px] md:text-xs"><thead><tr>' +
    '<th class="' + th + ' text-start">' + tr('sandColItem') + '</th><th class="' + th + '">' + tr('sandColPrice') + '</th>';
  for (var c = 0; c < cols.length; c++) html += '<th class="' + th + '">' + cols[c].head + '</th>';
  html += '</tr></thead><tbody>';
  for (var i = 0; i < products.length; i++) {
    var p = products[i]; if (p.category !== 'sandwiches') continue;
    html += '<tr class="border-t border-amber-500/20"><td class="px-1.5 py-1.5 text-start text-gray-100 font-semibold">' + pName(p) + '</td><td class="px-1.5 py-1.5 text-amber-300 font-bold">$' + fmtPrice(p.price) + '</td>';
    for (var k = 0; k < cols.length; k++) html += '<td class="px-1.5 py-1.5 text-gray-100 font-extrabold">' + Math.ceil(cols[k].need / p.price) + '</td>';
    html += '</tr>';
  }
  return html + '</tbody></table></div></div>';
}

function singleTrayNote() {
  if (currentCategory === 'single') return singleMealsNote('noteSingleMeals');
  if (currentCategory === 'sandwiches') return sandwichTable();
  var k = singleTrayFor[currentCategory];
  if (!k) return '';
  var name = tr(trays[k].label);
  return '<div class="col-span-full bg-amber-500/10 border border-amber-500/30 rounded-xl p-3 text-center space-y-2">' +
    '<p class="text-xs md:text-sm text-amber-300 font-bold">' + tr('noteSingle').replace('{tray}', name) + '</p>' +
    '<button type="button" onclick="goToTray(\'' + k + '\')" class="bg-amber-500 hover:bg-amber-600 text-gray-950 font-extrabold text-xs px-4 py-2 rounded-lg shadow">' + tr('goTray').replace('{tray}', name) + ' <i class="fa-solid ' + (lang === 'ar' ? 'fa-arrow-left' : 'fa-arrow-right') + ' mx-1"></i></button></div>';
}

var trayCameFrom = null;
var catLabelKey = { grills: 'catGrills', appetizers: 'catApp', pastries: 'catPastries' };

function backFromTray() {
  var cat = trayCameFrom; trayCameFrom = null;
  if (!cat) return;
  var btn = document.querySelector('.cat-btn[onclick*="\'' + cat + '\'"]');
  filterCategory(cat, btn);
  var box = byId('categories-container');
  if (box && box.scrollIntoView) box.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function goToTray(k) {
  trayCameFrom = currentCategory;
  currentTray = k;
  var btn = document.querySelector('.cat-btn[data-i18n="catTrays"]');
  filterCategory('trays', btn);
  var box = byId('categories-container');
  if (box && box.scrollIntoView) box.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function renderProducts() {
  var grid = byId('products-grid');
  if (!grid) return;
  if (currentCategory === 'trays') { renderTrays(); return; }
  var qi = byId('search-input');
  var query = (qi && qi.value) ? qi.value.toLowerCase().trim() : '';
  var html = '', found = false;
  for (var i = 0; i < products.length; i++) {
    var p = products[i];
    var hay = (p.name + ' ' + p.nameEn).toLowerCase();
    if ((currentCategory === 'all' || p.category === currentCategory || p.alsoIn === currentCategory) && (query === '' || hay.indexOf(query) !== -1)) {
      found = true;
      var note = pNote(p);
      html += '<div onclick="openProductModal(' + p.id + ')" class="bg-gray-900 border border-gray-800 rounded-2xl overflow-hidden shadow-lg flex flex-col cursor-pointer hover:border-amber-500/50 transition-all">' +
        '<div class="relative h-60 bg-gray-950 flex items-center justify-center">' + imgTag(p.image, pName(p)) +
        '<span class="absolute top-3 left-3 bg-black/75 px-3 py-1 rounded-full text-xs font-bold text-amber-400 z-10">' + startPrice(p) + '</span></div>' +
        '<div class="p-4 flex-1 flex flex-col justify-between text-center bg-gray-900">' +
        '<h3 class="font-extrabold text-base text-white mb-1">' + pName(p) + '</h3>' +
        (note ? '<p class="text-[11px] text-amber-300/90 mb-2 font-bold">' + note + '</p>' : '') +
        '<span class="text-xs text-amber-400 font-bold">' + tr('tapDetails') + '</span></div></div>';
    }
  }
  if (!found) html = '<div class="col-span-full text-center text-gray-400 py-16 text-sm font-bold">' + tr('noResults') + '</div>';
  grid.innerHTML = singleTrayNote() + html;
}

function filterCategory(cat, btn) {
  if (cat !== 'trays') trayCameFrom = null;
  currentCategory = cat;
  var buttons = document.querySelectorAll('.cat-btn');
  for (var i = 0; i < buttons.length; i++) buttons[i].className = "cat-btn px-4 py-2 rounded-xl font-semibold text-xs whitespace-nowrap bg-gray-800 text-gray-400";
  if (btn) btn.className = "cat-btn px-4 py-2 rounded-xl font-semibold text-xs whitespace-nowrap bg-amber-500 text-gray-950";
  renderProducts();
}

/* ---------- نافذة المنتج ---------- */
function fillModalText() {
  if (!currentActiveProduct) return;
  var p = currentActiveProduct;
  byId('modal-title').innerText = pName(p);
  var note = byId('modal-note'), n = pNote(p);
  if (n) { note.innerText = "📌 " + n; note.classList.remove('hidden'); }
  else note.classList.add('hidden');
  byId('size-small-btn').innerText = tr('sizeSmall');
  byId('size-medium-btn').innerText = tr('sizeMedium');
  byId('size-large-btn').innerText = tr('sizeLarge');
}

function openProductModal(id) {
  currentActiveProduct = findProduct(id);
  if (!currentActiveProduct) return;
  var p = currentActiveProduct;
  currentModalQty = p.minQty || 1;
  dolmaSelectedSize = 'small'; extraBreadQty = 0; extraSamoonQty = 0;
  byId('extra-bread-qty').innerText = 0;
  byId('extra-samoon-qty').innerText = 0;
  byId('item-custom-note').value = '';
  byId('modal-img-container').innerHTML = imgTag(p.image || 'gallery-1.jpg', '');
  fillModalText();

  if (p.isDolmaBased) {
    byId('dolma-size-section').classList.remove('hidden');
    byId('normal-qty-wrapper').classList.add('hidden');
    updateDolmaSizeUIButtons();
  } else {
    byId('dolma-size-section').classList.add('hidden');
    byId('normal-qty-wrapper').classList.remove('hidden');
  }

  if (breadAllowed(p)) byId('extra-bread-section').classList.remove('hidden');
  else byId('extra-bread-section').classList.add('hidden');

  updateModalPriceUI();
  byId('product-modal').classList.remove('hidden');
}

function breadAllowed(p) { return p.category === 'main' || p.category === 'grills' || p.category === 'fish' || p.category === 'single'; }

function closeProductModal() { byId('product-modal').classList.add('hidden'); }

function setDolmaSize(size) { dolmaSelectedSize = size; updateDolmaSizeUIButtons(); updateModalPriceUI(); }

function updateDolmaSizeUIButtons() {
  var sizes = ['small', 'medium', 'large'];
  for (var i = 0; i < sizes.length; i++) {
    byId('size-' + sizes[i] + '-btn').className = "py-2 px-3 rounded-xl border text-xs font-bold transition-all " +
      (dolmaSelectedSize === sizes[i] ? "bg-amber-500 text-gray-950 border-amber-400 font-extrabold shadow" : "bg-gray-950 text-gray-300 border-gray-700 hover:border-amber-500");
  }
}

function changeModalQty(dir) {
  var step = currentActiveProduct.stepQty || 1, min = currentActiveProduct.minQty || 1;
  currentModalQty += dir * step;
  if (currentModalQty < min) currentModalQty = min;
  updateModalPriceUI();
}

function changeExtra(type, dir) {
  if (type === 'extraBread') {
    extraBreadQty = Math.max(0, extraBreadQty + dir);
    byId('extra-bread-qty').innerText = extraBreadQty;
  } else {
    extraSamoonQty = Math.max(0, extraSamoonQty + dir);
    byId('extra-samoon-qty').innerText = extraSamoonQty;
  }
  updateModalPriceUI();
}

function updateModalPriceUI() {
  if (!currentActiveProduct) return;
  var r = calcItem(currentActiveProduct, currentModalQty, dolmaSelectedSize, lang);
  var dyn = byId('dynamic-serving-info');
  if (r.info) { dyn.innerText = r.info; dyn.classList.remove('hidden'); }
  else dyn.classList.add('hidden');
  byId('modal-qty').innerText = r.label;
  byId('modal-price').innerText = '$' + (r.price + extraBreadQty + extraSamoonQty).toFixed(2);
}

/* إعادة حساب أي عنصر في الصينية (السعر والتفاصيل والصور) بعد التعديل */
function recalcItem(item) {
  if (item.trayKey) {
    var tray = trays[item.trayKey], ar = [], en = [], imgs = [], lines = [], count = 0, sum = 0;
    for (var i = 0; i < tray.items.length; i++) {
      var it = tray.items[i], q = item.trayQty[it.key] || 0;
      if (q > 0) {
        var u = it.unit || tray.unit;
        imgs.push(it.image);
        lines.push(q + ' ' + u.ar + ' ' + it.name + ' — $' + (q * it.price).toFixed(2));
        ar.push(q + ' ' + u.ar + ' ' + it.name);
        en.push(q + ' ' + it.nameEn + ' ' + (q > 1 ? (u.enMany || u.en) : u.en));
        count += q; sum += q * it.price;
      }
    }
    item.qty = count; item.sum = sum;
    item.totalPrice = sum + (tray.extras ? item.extraBread + item.extraSamoon : 0);
    item.detailsAr = ar.join('، '); item.detailsEn = en.join(', ');
    item.images = imgs; item.linesAr = lines;
  } else {
    var a = calcItem(item.product, item.qty, item.size, 'ar');
    var e = calcItem(item.product, item.qty, item.size, 'en');
    item.detailsAr = a.label; item.detailsEn = e.label;
    item.totalPrice = a.price + item.extraBread + item.extraSamoon;
  }
}

function confirmAddToCart() {
  if (!currentActiveProduct) return;
  var item = {
    product: currentActiveProduct,
    images: [currentActiveProduct.image],
    qty: currentModalQty,
    size: dolmaSelectedSize,
    extraBread: extraBreadQty,
    extraSamoon: extraSamoonQty,
    customNote: byId('item-custom-note').value.trim()
  };
  recalcItem(item);
  cart.push(item);
  saveCart();
  updateCartBadge();
  closeProductModal();
}

/* ---------- السلة ---------- */
function updateCartBadge() {
  var badge = byId('cart-badge');
  if (cart.length > 0) { badge.innerText = cart.length; badge.classList.remove('hidden'); }
  else badge.classList.add('hidden');
}

function openCart() { renderCartItems(); byId('cart-modal').classList.remove('hidden'); }
function closeCart() { byId('cart-modal').classList.add('hidden'); }
function removeFromCart(index) { cart.splice(index, 1); saveCart(); updateCartBadge(); renderCartItems(); }

function cartThumb(item) {
  var imgs = (item.images && item.images.length) ? item.images : ((item.product && item.product.image) ? [item.product.image] : []);
  imgs = imgs.slice(0, 4);
  var cell = function (f) { return '<img src="' + encodeURI(imgFolder + f) + '" alt="" class="relative w-full h-full object-cover" onerror="this.style.display=\'none\'">'; };
  var inner = '';
  if (imgs.length === 1) inner = cell(imgs[0]);
  else if (imgs.length > 1) {
    inner = '<div class="relative grid grid-cols-2 gap-0.5 w-full h-full">';
    for (var i = 0; i < imgs.length; i++) inner += cell(imgs[i]);
    inner += '</div>';
  }
  return '<div class="relative flex-shrink-0 w-16 h-16 rounded-lg overflow-hidden bg-gray-900">' +
    '<span class="absolute inset-0 flex items-center justify-center text-2xl">🍲</span>' + inner + '</div>';
}

/* ---------- تعديل الكميات داخل الصينية ---------- */
function stepper(valText, minusCall, plusCall, disMinus) {
  return '<div class="flex items-center gap-2 bg-gray-900 px-2 py-1 rounded-lg border border-gray-700">' +
    '<button onclick="' + minusCall + '" class="w-6 h-6 rounded flex items-center justify-center font-bold text-xs ' + (disMinus ? 'bg-gray-800/40 text-gray-600' : 'bg-gray-800 hover:bg-gray-700 text-white') + '">-</button>' +
    '<span class="text-xs font-bold text-amber-400 min-w-[3.5rem] text-center">' + valText + '</span>' +
    '<button onclick="' + plusCall + '" class="w-6 h-6 bg-gray-800 hover:bg-gray-700 text-white rounded flex items-center justify-center font-bold text-xs">+</button></div>';
}

function cartRow(label, controlHtml) {
  return '<div class="flex items-center justify-between gap-2"><span class="text-xs text-gray-300">' + label + '</span>' + controlHtml + '</div>';
}

function cartChangeQty(i, dir) {
  var it = cart[i]; if (!it) return;
  var p = it.product, step = p.stepQty || 1, min = p.minQty || 1;
  var q = it.qty + dir * step;
  if (q < min) q = min;
  it.qty = q;
  recalcItem(it); saveCart(); renderCartItems();
}

function cartSetSize(i, size) {
  var it = cart[i]; if (!it) return;
  it.size = size;
  recalcItem(it); saveCart(); renderCartItems();
}

function cartChangeExtra(i, type, dir) {
  var it = cart[i]; if (!it) return;
  it[type] = Math.max(0, it[type] + dir);
  recalcItem(it); saveCart(); renderCartItems();
}

function cartChangeTrayQty(i, key, dir) {
  var it = cart[i]; if (!it) return;
  it.trayQty[key] = Math.max(0, (it.trayQty[key] || 0) + dir);
  var any = false;
  for (var k in it.trayQty) if (it.trayQty[k] > 0) any = true;
  if (!any) { removeFromCart(i); return; }
  recalcItem(it); saveCart(); renderCartItems();
}

function renderCartItems() {
  var container = byId('cart-items');
  if (!container) return;
  if (cart.length === 0) {
    container.innerHTML = '<div class="text-center text-gray-400 py-10 font-bold">' + tr('emptyTray') + '</div>';
    var bt0 = byId('cart-bar-total'); if (bt0) bt0.innerText = '$0.00';
    renderFulfillment();
    return;
  }
  var html = '', grandTotal = 0;
  for (var i = 0; i < cart.length; i++) {
    var item = cart[i], p = item.product, controls = '', hasExtras = false;
    grandTotal += item.totalPrice;

    if (item.trayKey) {
      var tray = trays[item.trayKey];
      for (var j = 0; j < tray.items.length; j++) {
        var it = tray.items[j], q = item.trayQty[it.key] || 0;
        if (q > 0) {
          controls += cartRow((lang === 'en' ? it.nameEn : it.name) + ' <span class="text-gray-500">$' + (q * it.price).toFixed(2) + '</span>',
            stepper(q, 'cartChangeTrayQty(' + i + ',\'' + it.key + '\',-1)', 'cartChangeTrayQty(' + i + ',\'' + it.key + '\',1)', false));
        }
      }
      if (item.sum < tray.minPrice) controls += '<p class="text-xs text-red-400 font-bold">' + tr('buildMinHint').replace('{n}', tray.minPrice) + '</p>';
      hasExtras = tray.extras;
    } else if (p.isDolmaBased) {
      var sizes = ['small', 'medium', 'large'], keys = ['sizeSmall', 'sizeMedium', 'sizeLarge'];
      controls += '<div class="grid grid-cols-3 gap-1.5">';
      for (var s = 0; s < 3; s++) {
        controls += '<button onclick="cartSetSize(' + i + ',\'' + sizes[s] + '\')" class="py-1.5 px-1 rounded-lg border text-[11px] font-bold ' +
          (item.size === sizes[s] ? 'bg-amber-500 text-gray-950 border-amber-400' : 'bg-gray-900 text-gray-300 border-gray-700') + '">' + tr(keys[s]) + '</button>';
      }
      controls += '</div>';
      hasExtras = (breadAllowed(p));
    } else {
      controls += cartRow(tr('qtyLabel'), stepper(calcItem(p, item.qty, item.size, lang).label,
        'cartChangeQty(' + i + ',-1)', 'cartChangeQty(' + i + ',1)', item.qty <= (p.minQty || 1)));
      hasExtras = (breadAllowed(p));
    }

    if (hasExtras) {
      controls += cartRow(tr('extraBreadLabel'), stepper(item.extraBread, 'cartChangeExtra(' + i + ',\'extraBread\',-1)', 'cartChangeExtra(' + i + ',\'extraBread\',1)', item.extraBread <= 0)) +
        cartRow(tr('extraSamoonLabel'), stepper(item.extraSamoon, 'cartChangeExtra(' + i + ',\'extraSamoon\',-1)', 'cartChangeExtra(' + i + ',\'extraSamoon\',1)', item.extraSamoon <= 0));
    }

    html += '<div class="bg-gray-950 p-3 rounded-xl border border-gray-800 space-y-2 relative">' +
      '<button onclick="removeFromCart(' + i + ')" class="absolute top-3 end-3 text-red-400 hover:text-red-300 text-xs font-bold"><i class="fa-solid fa-trash"></i></button>' +
      '<div class="flex gap-3 items-start">' + cartThumb(item) + '<div class="flex-1 min-w-0 space-y-2 pe-7">' +
      '<h4 class="font-extrabold text-amber-400 text-sm">' + pName(p) + '</h4>' +
      (item.customNote ? '<p class="text-xs text-amber-300 font-semibold bg-amber-500/10 p-2 rounded border border-amber-500/30">' + tr('custNote') + ' "' + item.customNote + '"</p>' : '') +
      '</div></div>' +
      '<div class="space-y-2 pt-2 border-t border-gray-800">' + controls + '</div>' +
      '<div class="pt-2 border-t border-gray-800 text-left font-black text-amber-400 text-sm">$' + item.totalPrice.toFixed(2) + '</div></div>';
  }
  container.innerHTML = html;
  var bt = byId('cart-bar-total'); if (bt) bt.innerText = '$' + grandTotal.toFixed(2);
  renderFulfillment();
}

/* ---------- طريقة الاستلام: توصيل أو استلام بنفسه ---------- */
var FREE_DELIVERY_MIN = 70;    // الطلب من هذا المبلغ فأكثر: التوصيل مجاني ضمن Greensboro وضواحيها
var fulfillment = 'delivery';  // 'delivery' أو 'pickup'
var MIN_DELIVERY_ORDER = 35;   // أقل مجموع طلب للتوصيل بالدولار (اجعله 0 لإلغائه)
var MIN_PICKUP_ORDER = 15;     // أقل مجموع طلب للاستلام الذاتي بالدولار (اجعله 0 لإلغائه)

function cartSubtotal() { var s = 0; for (var i = 0; i < cart.length; i++) s += cart[i].totalPrice; return s; }

function minNoteHtml(pick, sub) {
  var min = pick ? MIN_PICKUP_ORDER : MIN_DELIVERY_ORDER;
  if (!(min > 0)) return '';
  var mode = tr(pick ? 'minModePickup' : 'minModeDelivery');
  if (cart.length > 0 && sub < min) {
    return '<p class="text-xs text-red-400 font-bold">⚠️ ' + tr('minShort').replace('{n}', (min - sub).toFixed(2)).replace('{min}', min).replace('{mode}', mode) + '</p>';
  }
  if (cart.length === 0) return '<p class="text-[11px] text-gray-400">' + tr('minRule').replace('{min}', min).replace('{mode}', mode) + '</p>';
  return '';
}

function setFulfillment(mode) { fulfillment = mode; saveCustomer(); renderFulfillment(); }

function renderFulfillment() {
  var bd = byId('ful-delivery'), bp = byId('ful-pickup'), note = byId('ful-note');
  if (!bd || !bp || !note) return;
  var act = 'py-2 px-2 rounded-lg border text-xs font-bold bg-amber-500 text-gray-950 border-amber-400';
  var off = 'py-2 px-2 rounded-lg border text-xs font-bold bg-gray-900 text-gray-300 border-gray-700 hover:border-amber-500';
  var pick = (fulfillment === 'pickup');
  bd.className = pick ? off : act;
  bp.className = pick ? act : off;

  // حقول العنوان تختفي عند الاستلام بنفسه
  var fields = [byId('street-address'), byId('address-notes'), byId('city') ? byId('city').parentElement : null];
  for (var i = 0; i < fields.length; i++) {
    if (!fields[i]) continue;
    if (pick) fields[i].classList.add('hidden'); else fields[i].classList.remove('hidden');
  }

  var sub = cartSubtotal(), html = '';
  var rule = tr('fRule').replace('{min}', FREE_DELIVERY_MIN);
  if (pick) {
    html = '<p class="text-xs text-emerald-400 font-bold">' + tr('fNotePickup') + '</p>';
  } else if (cart.length > 0 && sub >= FREE_DELIVERY_MIN) {
    html = '<p class="text-xs text-emerald-400 font-bold">' + tr('fNoteFree') + '</p>';
  } else if (cart.length > 0) {
    html = '<p class="text-xs text-amber-300 font-bold">💡 ' + tr('fHint').replace('{n}', (FREE_DELIVERY_MIN - sub).toFixed(2)).replace('{min}', FREE_DELIVERY_MIN) + '</p>' +
      '<p class="text-[11px] text-gray-400">' + tr('fNoteFee').replace('{min}', FREE_DELIVERY_MIN) + '</p>';
  } else {
    html = '<p class="text-[11px] text-gray-400">' + rule + '</p>';
  }
  note.innerHTML = minNoteHtml(pick, sub) + html;
}

/* ---------- إرسال الطلب عبر الواتساب (الرسالة بالعربية دائماً) ---------- */
/* ---------- صياغة رسالة الواتساب (بالعربية دائماً) ---------- */
function formatDateAr(dateStr) {
  try {
    var parts = dateStr.split('-');
    var dt = new Date(+parts[0], +parts[1] - 1, +parts[2]);
    var out = dt.toLocaleDateString('ar-u-ca-gregory-nu-latn', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
    return out || dateStr;
  } catch (e) { return dateStr; }
}

function formatTimeAr(t) {
  var m = /^(\d{1,2}):(\d{2})/.exec(t);
  if (!m) return t;
  var h = +m[1], suffix = h >= 12 ? 'م' : 'ص', h12 = h % 12 || 12;
  return h12 + ':' + m[2] + ' ' + suffix;
}

function buildOrderMessage(c) {
  var SEP = "━━━━━━━━━━━━━━━\n";
  var msg = "🍽️ *طلب جديد - أكلاتنا*\n" + SEP;

  msg += "👤 *بيانات الزبون*\n";
  msg += "الاسم: " + c.name + "\n";
  if (c.phone) msg += "الهاتف: " + c.phone + "\n";
  if (!c.pickup) {
    msg += "العنوان: " + c.street + "، " + c.city + "، " + c.state + " " + c.zip + "\n";
    if (c.notes) msg += "ملاحظات العنوان: " + c.notes + "\n";
  }
  msg += SEP;

  msg += "⏰ *موعد الاستلام*\n";
  msg += "التاريخ: " + formatDateAr(c.date) + "\n";
  msg += "الوقت: " + formatTimeAr(c.time) + "\n";
  msg += SEP;

  msg += "🧾 *الطلبات (" + cart.length + ")*\n\n";
  var grandTotal = 0;
  for (var i = 0; i < cart.length; i++) {
    var item = cart[i];
    grandTotal += item.totalPrice;
    msg += "*" + (i + 1) + ") " + item.product.name + "*\n";
    if (item.linesAr && item.linesAr.length) {
      for (var j = 0; j < item.linesAr.length; j++) msg += "   • " + item.linesAr[j] + "\n";
    } else {
      msg += "   • الكمية: " + item.detailsAr + "\n";
    }
    if (item.extraBread > 0) msg += "   • " + item.extraBread + " رغيف خبز\n";
    if (item.extraSamoon > 0) msg += "   • " + item.extraSamoon + " قطعة صمون\n";
    if (item.customNote) msg += "   📌 ملاحظة: " + item.customNote + "\n";
    msg += "   💵 السعر: $" + item.totalPrice.toFixed(2) + "\n\n";
  }
  msg += SEP;
  if (c.pickup) msg += "🏠 *الاستلام:* من عندنا (بدون توصيل)\n";
  else msg += "🚚 *التوصيل:* " + (grandTotal >= FREE_DELIVERY_MIN ? "مجاني ✅ (ضمن Greensboro وضواحيها)" : "تُحدد الرسوم معك") + "\n";
  msg += "💰 *المجموع الكلي: $" + grandTotal.toFixed(2) + "*";
  return msg;
}

/* يتحقق من البيانات ويبني نص الطلب (أو يرجع null بعد تنبيه الزبون) */
function prepareOrder() {
  if (cart.length === 0) {
    alert(tr('alertEmpty'));
    return null;
  }

  var minOrder = (fulfillment === 'pickup') ? MIN_PICKUP_ORDER : MIN_DELIVERY_ORDER, subNow = cartSubtotal();
  if (minOrder > 0 && subNow < minOrder) {
    alert(tr('minAlert').replace('{mode}', tr(fulfillment === 'pickup' ? 'minModePickup' : 'minModeDelivery')).replace('{min}', minOrder).replace('{now}', subNow.toFixed(2)).replace('{n}', (minOrder - subNow).toFixed(2)));
    return null;
  }

  var val = function (id) { var el = byId(id); return el ? el.value.trim() : ''; };

  var customerName = val('customer-name');
  var customerPhone = val('customer-phone');
  var street = val('street-address');
  var city = val('city');
  var state = val('state');
  var zip = val('zip-code');
  var addressNotes = val('address-notes');
  var deliveryDate = val('delivery-date');
  var deliveryTime = val('delivery-time');

  var pickup = (fulfillment === 'pickup');
  if (!customerName || (!pickup && !street)) {
    alert(tr(pickup ? 'alertName' : 'alertNameAddr'));
    return null;
  }

  if (!deliveryDate || !deliveryTime) {
    alert(tr('alertDateTime'));
    return null;
  }
  var pickupAt = new Date(deliveryDate + 'T' + deliveryTime);
  var earliest = new Date(Date.now() + 24 * 60 * 60 * 1000);
  if (isNaN(pickupAt.getTime()) || pickupAt < earliest) {
    alert(tr('alert24'));
    return null;
  }

  for (var ci = 0; ci < cart.length; ci++) {
    if (cart[ci].trayKey && cart[ci].sum < trays[cart[ci].trayKey].minPrice) {
      alert(pName(cart[ci].product) + ': ' + minAlertText(cart[ci].trayKey));
      return null;
    }
  }

  return buildOrderMessage({
    name: customerName, street: street, city: city, state: state, zip: zip,
    notes: addressNotes, date: deliveryDate, time: deliveryTime, pickup: pickup, phone: customerPhone
  });
}

function sendWhatsAppOrder() {
  var message = prepareOrder();
  if (!message) return;
  saveCustomer();
  writeState({ sentAt: Date.now() });
  window.location.href = "https://wa.me/" + CONTACT_PHONE + "?text=" + encodeURIComponent(message);
}

/* نسخ الطلب (احتياط إن لم يفتح الواتساب) */
function copyOrder() {
  var message = prepareOrder();
  if (!message) return;
  saveCustomer();
  var manual = function () { window.prompt(tr('shareCopyPrompt'), message); };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(message).then(function () { showToast(tr('orderCopied')); }, manual);
  } else manual();
}

/* ---------- حفظ الصينية وبيانات الزبون على جهازه فقط (localStorage) ---------- */
var STATE_KEY = 'aklatna_state_v1';
var CART_KEEP_MS = 2 * 24 * 60 * 60 * 1000;      // تُحفظ الصينية يومين
var SENT_GRACE_MS = 10 * 60 * 1000;               // بعد الإرسال: تُمسح الصينية بعد 10 دقائق
var CUSTOMER_FIELDS = ['customer-name', 'customer-phone', 'street-address', 'city', 'state', 'zip-code', 'address-notes'];
var stateTimer = null;

function readState() { try { return JSON.parse(localStorage.getItem(STATE_KEY)) || {}; } catch (e) { return {}; } }
function writeState(patch) {
  try { var st = readState(); for (var k in patch) st[k] = patch[k]; localStorage.setItem(STATE_KEY, JSON.stringify(st)); } catch (e) {}
}

function saveCart() {
  var items = [];
  for (var i = 0; i < cart.length; i++) {
    var it = cart[i];
    if (it.trayKey) items.push({ t: it.trayKey, q: it.trayQty, b: it.extraBread, s: it.extraSamoon, n: it.customNote });
    else items.push({ p: it.product.id, q: it.qty, z: it.size, b: it.extraBread, s: it.extraSamoon, n: it.customNote });
  }
  writeState({ cart: items, cartAt: Date.now() });
}

function saveCustomer() {
  var c = {};
  for (var i = 0; i < CUSTOMER_FIELDS.length; i++) { var el = byId(CUSTOMER_FIELDS[i]); if (el) c[CUSTOMER_FIELDS[i]] = el.value; }
  writeState({ cust: c, ful: fulfillment });
}

function bindCustomerSave() {
  var later = function () { clearTimeout(stateTimer); stateTimer = setTimeout(saveCustomer, 400); };
  for (var i = 0; i < CUSTOMER_FIELDS.length; i++) { var el = byId(CUSTOMER_FIELDS[i]); if (el) el.addEventListener('input', later); }
}

function loadState() {
  var st = readState(), now = Date.now(), i;
  if (st.cust) {
    for (i = 0; i < CUSTOMER_FIELDS.length; i++) {
      var el = byId(CUSTOMER_FIELDS[i]), v = st.cust[CUSTOMER_FIELDS[i]];
      if (el && typeof v === 'string' && v.length > 0) el.value = v;
    }
  }
  if (st.ful === 'pickup' || st.ful === 'delivery') fulfillment = st.ful;

  if (!st.cart || !st.cart.length || !st.cartAt || now - st.cartAt > CART_KEEP_MS) return;
  if (st.sentAt && st.sentAt >= st.cartAt && now - st.sentAt > SENT_GRACE_MS) return;   // الطلب أُرسل سابقاً

  for (i = 0; i < st.cart.length; i++) {
    var r = st.cart[i], item = null;
    if (r.t) {
      var tray = trays[r.t]; if (!tray) continue;
      var tq = {};
      for (var j = 0; j < tray.items.length; j++) tq[tray.items[j].key] = Math.max(0, +(r.q && r.q[tray.items[j].key]) || 0);
      item = { product: { id: 'tray-' + r.t, name: tray.cart.ar, nameEn: tray.cart.en }, trayKey: r.t, trayQty: tq, size: '',
               extraBread: Math.max(0, +r.b || 0), extraSamoon: Math.max(0, +r.s || 0), customNote: String(r.n || '') };
    } else {
      var p = findProduct(r.p); if (!p) continue;                      // صنف حُذف من القائمة
      item = { product: p, images: [p.image], qty: Math.max(p.minQty || 1, +r.q || 1), size: (r.z === 'medium' || r.z === 'large') ? r.z : 'small',
               extraBread: Math.max(0, +r.b || 0), extraSamoon: Math.max(0, +r.s || 0), customNote: String(r.n || '') };
    }
    recalcItem(item);                                                   // الأسعار تُحسب من جديد بالأسعار الحالية
    if (item.trayKey && item.qty === 0) continue;
    cart.push(item);
  }
  updateCartBadge();
}

/* ---------- تبديل اللغة ---------- */
function applyLang() {
  document.documentElement.lang = lang;
  document.documentElement.dir = (lang === 'ar') ? 'rtl' : 'ltr';

  var els = document.querySelectorAll('[data-i18n]');
  for (var i = 0; i < els.length; i++) els[i].textContent = T[els[i].getAttribute('data-i18n')][lang];

  var phs = document.querySelectorAll('[data-i18n-ph]');
  for (var j = 0; j < phs.length; j++) phs[j].placeholder = T[phs[j].getAttribute('data-i18n-ph')][lang];

  var arrows = document.querySelectorAll('.back-arrow');
  for (var k = 0; k < arrows.length; k++) arrows[k].className = 'fa-solid back-arrow ' + (lang === 'ar' ? 'fa-arrow-right' : 'fa-arrow-left');

  byId('lang-btn').textContent = T.toggleBtn[lang];
  document.title = lang === 'ar' ? 'أكلاتنا - طبخ بيتي عراقي في جرينزبورو' : 'Aklatna - Iraqi Home Cooking in Greensboro';

  renderProducts();
  renderFulfillment();
  if (!byId('cart-modal').classList.contains('hidden')) renderCartItems();
  if (!byId('product-modal').classList.contains('hidden')) { fillModalText(); updateModalPriceUI(); }
}

function initContact() {
  var wa = "https://wa.me/" + CONTACT_PHONE + "?text=" + encodeURIComponent("مرحباً أكلاتنا، عندي استفسار قبل الطلب");
  var tel = "tel:+" + CONTACT_PHONE;
  var d = CONTACT_PHONE.replace(/^1/, '');
  var shown = "(" + d.slice(0, 3) + ") " + d.slice(3, 6) + "-" + d.slice(6);
  var i, a = document.querySelectorAll('.js-wa'), t = document.querySelectorAll('.js-tel'), x = document.querySelectorAll('.js-phone-text');
  for (i = 0; i < a.length; i++) a[i].href = wa;
  for (i = 0; i < t.length; i++) t[i].href = tel;
  for (i = 0; i < x.length; i++) x[i].textContent = shown;
}

var deferredInstall = null;
var INSTALL_DISMISS_KEY = 'aklatna_install_dismissed';
window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); deferredInstall = e; refreshInstallUI(); });
window.addEventListener('appinstalled', function () { deferredInstall = null; refreshInstallUI(); closeInstall(); });

function isStandalone() {
  return (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true;
}

function installDismissed() {
  try { var t = +localStorage.getItem(INSTALL_DISMISS_KEY) || 0; return Date.now() - t < 14 * 24 * 60 * 60 * 1000; } catch (e) { return false; }
}

function dismissInstallBar() {
  try { localStorage.setItem(INSTALL_DISMISS_KEY, String(Date.now())); } catch (e) {}
  refreshInstallUI();
}

function refreshInstallUI() {
  var row = byId('install-row'), now = byId('install-now'), bar = byId('install-bar');
  if (row) row.classList.toggle('hidden', isStandalone());                       // لا حاجة للزر إن كان يعمل كتطبيق أصلاً
  if (bar) bar.classList.toggle('hidden', isStandalone() || installDismissed());  // الشريط يختفي بعد إغلاقه (14 يوماً)
  if (now) now.classList.toggle('hidden', !deferredInstall);                      // التثبيت المباشر حيث يسمح الجهاز (أندرويد/كروم)
  var plat = installPlatform(), ios = byId('install-ios'), and = byId('install-android');
  if (ios) ios.classList.toggle('hidden', plat === 'android');                    // الآيفون: خطوات سفاري فقط
  if (and) and.classList.toggle('hidden', plat === 'ios' || (plat === 'android' && !!deferredInstall));
}

function installPlatform() {
  var ua = navigator.userAgent || '';
  if (/iPhone|iPad|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1)) return 'ios';
  if (/Android/.test(ua)) return 'android';
  return 'other';
}

function installFromBar() { if (deferredInstall) doInstall(); else openInstall(); }

function openInstall() {
  var m = byId('contact-menu'); if (m) m.classList.add('hidden');
  refreshInstallUI();
  byId('install-panel').classList.remove('hidden');
}

function closeInstall() { var pn = byId('install-panel'); if (pn) pn.classList.add('hidden'); }

function doInstall() {
  if (!deferredInstall) return;
  var ev = deferredInstall; deferredInstall = null;
  ev.prompt();
  if (ev.userChoice && ev.userChoice.then) ev.userChoice.then(function () { refreshInstallUI(); closeInstall(); });
  else { refreshInstallUI(); closeInstall(); }
}

function syncPickFields() {
  var pairs = [['delivery-date', 'date-ph'], ['delivery-time', 'time-ph']];
  for (var i = 0; i < pairs.length; i++) {
    var el = byId(pairs[i][0]), ph = byId(pairs[i][1]);
    if (!el || !ph) continue;
    el.classList.toggle('is-empty', !el.value);
    ph.classList.toggle('hidden', !!el.value);
  }
}

function bindPickFields() {
  var ids = ['delivery-date', 'delivery-time'];
  for (var i = 0; i < ids.length; i++) {
    var el = byId(ids[i]);
    if (el) { el.addEventListener('input', syncPickFields); el.addEventListener('change', syncPickFields); }
  }
  syncPickFields();
}

function toggleContact() {
  var m = byId('contact-menu');
  if (m) m.classList.toggle('hidden');
}
document.addEventListener('click', function (e) {
  var fab = byId('contact-fab'), m = byId('contact-menu');
  if (fab && m && !m.classList.contains('hidden') && !fab.contains(e.target)) m.classList.add('hidden');
});

function showToast(msg) {
  var t = byId('toast'); if (!t) return;
  t.textContent = msg; t.classList.remove('hidden');
  clearTimeout(showToast.tm);
  showToast.tm = setTimeout(function () { t.classList.add('hidden'); }, 2500);
}

var shareFile = null;
function prepareShareFile() {
  try {
    if (!window.fetch || !window.File || !navigator.canShare) return;
    fetch(imgFolder + 'logo-square.jpg').then(function (r) { if (!r.ok) throw 0; return r.blob(); }).then(function (b) {
      shareFile = new File([b], 'aklatna.jpg', { type: b.type || 'image/jpeg' });
    }).catch(function () {});
  } catch (e) {}
}

function closeSharePanel() { var pn = byId('share-panel'); if (pn) pn.classList.add('hidden'); }

function openSharePanel(url) {
  var text = tr('shareText'), full = text + '\n' + url, enc = encodeURIComponent;
  var apps = [
    { icon: 'fa-brands fa-whatsapp', color: 'text-green-400', label: 'WhatsApp', href: 'https://wa.me/?text=' + enc(full) },
    { icon: 'fa-brands fa-telegram', color: 'text-sky-400', label: 'Telegram', href: 'https://t.me/share/url?url=' + enc(url) + '&text=' + enc(text) },
    { icon: 'fa-brands fa-facebook', color: 'text-blue-400', label: 'Facebook', href: 'https://www.facebook.com/sharer/sharer.php?u=' + enc(url) },
    { icon: 'fa-brands fa-twitter', color: 'text-sky-300', label: 'X / Twitter', href: 'https://twitter.com/intent/tweet?text=' + enc(text) + '&url=' + enc(url) },
    { icon: 'fa-solid fa-envelope', color: 'text-amber-300', label: tr('shareEmail'), href: 'mailto:?subject=' + enc(tr('shareTitle')) + '&body=' + enc(full) },
    { icon: 'fa-solid fa-message', color: 'text-emerald-300', label: tr('shareSms'), href: 'sms:?&body=' + enc(full) }
  ];
  var html = '';
  for (var i = 0; i < apps.length; i++) {
    html += '<a href="' + apps[i].href + '" target="_blank" rel="noopener" class="flex flex-col items-center gap-1.5 py-3 rounded-xl bg-gray-800 hover:bg-gray-700 border border-gray-700"><i class="' + apps[i].icon + ' ' + apps[i].color + ' text-2xl"></i><span class="text-[11px] font-bold text-gray-200">' + apps[i].label + '</span></a>';
  }
  html += '<button type="button" id="share-copy-btn" class="col-span-3 flex items-center justify-center gap-2 py-3 rounded-xl bg-gray-800 hover:bg-gray-700 border border-amber-500/50 text-amber-400 text-xs font-bold"><i class="fa-solid fa-link"></i><span>' + tr('shareCopy') + '</span></button>';
  byId('share-panel-grid').innerHTML = html;
  byId('share-copy-btn').onclick = function () {
    var done = function () { showToast(tr('shareCopied')); closeSharePanel(); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(url).then(done, function () { window.prompt(tr('shareCopyPrompt'), url); });
    else window.prompt(tr('shareCopyPrompt'), url);
  };
  byId('share-panel').classList.remove('hidden');
}

function shareLinkOnly(url) {
  if (navigator.share) {
    navigator.share({ title: tr('shareTitle'), text: tr('shareText'), url: url }).catch(function (e) {
      if (e && e.name === 'AbortError') return;
      openSharePanel(url);
    });
    return;
  }
  openSharePanel(url);
}

/* المشاركة: صورة الشعار + رسالة فيها الرابط (وإن لم يدعم الجهاز مشاركة الصور تُشارَك الرابط فقط) */
function shareSite() {
  var url = location.origin + location.pathname;
  if (shareFile && navigator.share && navigator.canShare && navigator.canShare({ files: [shareFile] })) {
    navigator.share({ files: [shareFile], title: tr('shareTitle'), text: tr('shareText') + '\n' + url }).catch(function (e) {
      if (e && e.name === 'AbortError') return;      // ألغى المستخدم المشاركة
      shareLinkOnly(url);
    });
    return;
  }
  shareLinkOnly(url);
}

function toggleLang() {
  lang = (lang === 'ar') ? 'en' : 'ar';
  try { localStorage.setItem('aklatna_lang', lang); } catch (e) {}
  applyLang();
}

refreshInstallUI();
loadState();
applyLang();
initContact();
prepareShareFile();
bindCustomerSave();
bindPickFields();

/* تعطيل اليوم والأيام السابقة في التقويم */
(function () {
  var d = new Date();
  d.setDate(d.getDate() + 1);
  var min = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  var el = byId('delivery-date');
  if (el) el.min = min;
})();
</script>
